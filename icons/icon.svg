<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BizForce AI">
  <!-- Source of truth for the app icons. The glyph is the same layers mark
       used in the dashboard topbar (dashboard.html, .topbar-mark), drawn on
       the #070b18 ground in the BizForce gradient. The PNGs in this folder
       are rasterised from these coordinates. -->
  <defs>
    <linearGradient id="bfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="bfDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8ff0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4f8ff0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#070b18"/>
  <circle cx="256" cy="256" r="232" fill="url(#bfDisc)"/>

  <g transform="translate(107.52 107.52) scale(12.3733)"
     fill="none" stroke="url(#bfGrad)" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
    <path d="M2 17l10 5 10-5"/>
    <path d="M2 12l10 5 10-5"/>
  </g>
</svg>
