<!DOCTYPE html>
<html lang="en" data-bf-tabbar="off">
<head>
<script src="/scripts/bf-theme.js"></script>
<script src="/scripts/bf-session.js"></script>
<script src="/scripts/bf-offline.js"></script>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>BizForce AI — New post</title>
  <link rel="stylesheet" href="/css/bizforce-ui.css"/>
  <style>
    /* P2-3 (Nov 20 2026): the composer, full screen. A phone opens it from the Create sheet (scripts/bf-tabbar.js); the
       bottom bar is off here (data-bf-tabbar="off"). A desktop opens the same composer as a modal over its page. */
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e8e8ff;background:#070b18}
    body{min-height:100vh;position:relative;overflow-x:hidden}
    .page{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom, 0px))}
    .compose-top{display:flex;align-items:center;gap:12px;margin:0 0 16px}
    .compose-top h1{flex:1;margin:0;font-size:1.3rem;font-weight:800;color:#f4f7ff}
    .compose-close{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.16);color:#e8e8ff;text-decoration:none}
    .compose-close svg{width:18px;height:18px}
  </style>
<link rel="stylesheet" href="/css/bf-phone.css"><!-- NAMED (Nov 19 2026, PH1): the phone layout; every rule is inside @media (max-width: 760px), so the desktop is unchanged. -->
</head>
<body>
<div class="page">
  <header class="compose-top">
    <a class="compose-close" href="/home.html" aria-label="Close and go to Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1>New post</h1>
  </header>
  <main id="composer"></main>
</div>
<script src="/scripts/bf-composer.js"></script>
<script>
  window.BFComposer.mount(document.getElementById("composer"));
</script>
<script src="/scripts/termaximus-presence.js"></script>
<!-- NAMED (Nov 20 2026, FX1): the legal footer every page carries (backend scripts/checkLegalPages.js H1); P2-3 left it out of this page -->
<footer class="bf-legal-footer" data-bf-legal-footer></footer>
<script src="/scripts/bf-legal-footer.js"></script>
</body>
</html>
