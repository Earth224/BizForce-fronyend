<!DOCTYPE html>
<html lang="en">
<head>
<script src="/scripts/bf-theme.js"></script>
<script src="/scripts/bf-session.js"></script>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BizForce AI — Music</title>
  <link rel="stylesheet" href="/css/bizforce-ui.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e8e8ff;background:#070b18}
    body{min-height:100vh;position:relative;overflow-x:hidden}
    /* The backdrop is the token rule in scripts/bf-theme.js. */
    .page{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center}
    /* The small window wears the boombox-mixer's own look: the same finish, a noir stage under it. */
    .popout-head{width:100%;max-width:560px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .popout-title{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,var(--bf-accent-a, #22d3ee)var(--bf-accent-mid, ),var(--bf-accent-b, #a855f7));-webkit-background-clip:text;background-clip:text;color:transparent}
    .popout-note{width:100%;max-width:560px;margin:12px 0 0;padding:8px 12px;border-radius:10px;font-size:.78rem;color:#c8cce8;background:rgba(8,12,28,.7);border:1px solid rgba(var(--bf-accent-a-rgb, 34, 211, 238),.2)}
  </style>
</head>
<body>
<main class="page">
  <!-- scripts/bf-music.js draws the player here, as the pop-out: it keeps
       playing while the member moves around BizForce, and the open pages
       relay their controls to it. Closing this window stops the music. -->
  <div class="popout-head"><h1 class="popout-title">BizForce music</h1></div>
  <div id="bfMusicPopout"></div>
  <p class="popout-note">This window keeps your music playing while you move around BizForce. Close it to stop the music.</p>
</main>
<script src="/scripts/bf-boombox.js"></script>
<script src="/scripts/bf-music.js"></script>
<footer class="bf-legal-footer" data-bf-legal-footer></footer>
<script src="/scripts/bf-legal-footer.js"></script>
</body>
</html>
