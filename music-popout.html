<!DOCTYPE html>
<html lang="en">
<head>
<script src="/scripts/bf-theme.js"></script>
<script src="/scripts/bf-session.js"></script>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BizForce AI — Music</title>
  <link rel="stylesheet" href="/css/bizforce-ui.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e8e8ff;background:#070b18}
    body{min-height:100vh;position:relative;overflow-x:hidden}
    /* The backdrop is the token rule in scripts/bf-theme.js. */
    .page{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px}
    .popout-note{margin:10px 2px 0;font-size:.78rem;color:#8892b8}
  </style>
</head>
<body>
<main class="page">
  <!-- scripts/bf-music.js draws the player here, as the pop-out: it keeps
       playing while the member moves around BizForce, and the open pages
       relay their controls to it. Closing this window stops the music. -->
  <div id="bfMusicPopout"></div>
  <p class="popout-note">This window keeps your music playing while you move around BizForce. Close it to stop the music.</p>
</main>
<script src="/scripts/bf-boombox.js"></script>
<script src="/scripts/bf-music.js"></script>
<footer class="bf-legal-footer" data-bf-legal-footer></footer>
<script src="/scripts/bf-legal-footer.js"></script>
</body>
</html>
