<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Confirm Email - BizForce AI</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030308;color:#e8e8ff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#080812;border:1px solid rgba(0,229,255,0.2);border-radius:20px;padding:40px;width:90%;max-width:400px}
h1{background:linear-gradient(135deg,#00e5ff,#9f6bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;font-size:1.8rem;margin-bottom:6px}
p{color:#8888aa;text-align:center;font-size:0.85rem;margin-bottom:24px}
.err{color:#ff2d78;font-size:0.82rem;text-align:center;margin-top:10px;min-height:20px;line-height:1.6}
.ok{color:#00e5ff;font-size:0.9rem;text-align:center;line-height:1.6}
.back{text-align:center;margin-top:18px}
.back a{color:#8888aa;font-size:0.8rem;text-decoration:none}
.back a:hover{color:#00e5ff}
</style></head><body>
<div class="box">
  <h1>Confirm Email</h1>
  <p id="sub">Confirming your email address...</p>

  <div id="done" style="display:none"></div>
  <div class="err" id="err"></div>
  <div class="back"><a href="/app">Go to sign in</a></div>
</div>

<script>
const A = 'https://dynamic-prosperity-production-5382.up.railway.app';

// The token arrives as ?token=... on the link in the verification email. Read
// once at load. Public page: no session is needed or checked, because the
// person following the link may not be signed in on this device.
const token = new URLSearchParams(window.location.search).get('token') || '';

function err(m) {
  document.getElementById('err').textContent = m;
}

function sub(m) {
  document.getElementById('sub').textContent = m;
}

async function confirmEmail() {
  if (!token) {
    sub('This link is missing its verification token');
    return err('Open the link exactly as it appears in your email.');
  }

  try {
    const r = await fetch(A + '/api/auth/verify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    });
    let d = {};
    try { d = await r.json(); } catch (parseErr) { d = {}; }

    if (!r.ok) {
      /* Expired and invalid are told apart by the server's reason field, and
         each gets its own heading. Confirming an address is not required to
         use the account, so neither state tells the person they are locked
         out, and nothing promises a new link, because none can be requested
         yet. */
      if (d.reason === 'expired') {
        sub('This link has expired');
        return err((d.error || 'This verification link has expired.') +
          ' Confirmation links last one hour. Your account works as normal in the meantime.');
      }
      if (d.reason === 'invalid') {
        sub('This link is not valid');
        return err((d.error || 'This verification link is not valid.') +
          ' If you have already confirmed your address, there is nothing more to do.');
      }
      sub('Your email could not be confirmed');
      return err(d.error || ('The server could not confirm your email (HTTP ' + r.status + '). Try the link again.'));
    }

    // Confirmed. Single use, so there is nothing left to press; no redirect,
    // so the person reads what happened.
    document.getElementById('sub').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    document.getElementById('done').innerHTML =
      '<div class="ok">Your email address is confirmed.<br>You can close this page or go to sign in.</div>';
  } catch (x) {
    sub('Your email could not be confirmed');
    err('Connection error: ' + x.message + '. Try the link again.');
  }
}

confirmEmail();
</script>
<script src="/scripts/termaximus-presence.js"></script>
</body></html>
