<!DOCTYPE html>
<html lang="en">
<head>
<script src="/scripts/bf-theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BizForce AI — Vertical Marketing Agent</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070b18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BizForce">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <script src="/scripts/bf-session.js"></script>
  <script src="/scripts/bf-offline.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: #e8e8ff;
      background: #070b18;
    }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* The backdrop is the token rule in scripts/bf-theme.js. */

    .page {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 64px;
      /* viewport-fit=cover is on; black-translucent puts this view under the
         iOS status bar, so the top gutter has to clear it, and in landscape
         the notch eats into the sides. */
      padding-top: calc(32px + env(safe-area-inset-top, 0px));
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px));
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.25);
      background: rgba(12, 18, 38, 0.6);
      color: #22d3ee;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .back-link:hover {
      border-color: rgba(0, 229, 255, 0.55);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
      transform: translateY(-1px);
    }

    .brand-badge {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--bf-mark-a, #22d3ee), var(--bf-mark-b, #a855f7));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .agent-header {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .agent-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.18), rgba(168, 85, 247, 0.22));
      border: 2px solid rgba(0, 229, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.18), 0 0 32px rgba(168, 85, 247, 0.12);
      flex-shrink: 0;
    }

    .agent-avatar svg {
      width: 34px;
      height: 34px;
      opacity: 0.85;
    }

    .agent-header-text { flex: 1; min-width: 220px; }

    .agent-title {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00e5ff 0%, #7b2ff7 60%, #a855f7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .agent-subtitle {
      margin: 0 0 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #8892b8;
    }

    .context-card {
      padding: 24px;
      border-radius: 20px;
      background: rgba(12, 18, 38, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      margin-bottom: 32px;
    }

    .context-card:hover {
      border-color: rgba(0, 229, 255, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35), 0 0 30px rgba(0, 229, 255, 0.08);
    }

    .section-label {
      margin: 0 0 14px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #22d3ee;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .context-item label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8888aa;
      margin-bottom: 4px;
    }

    .context-item span {
      font-size: 0.9rem;
      color: #e8e8ff;
      line-height: 1.5;
      word-break: break-word;
    }

    .research-goals {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .research-goals p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #c4b5fd;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .toolbar-meta {
      font-size: 0.85rem;
      color: #8888aa;
    }

    .toolbar-meta strong {
      color: #22d3ee;
      font-weight: 700;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border: none;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--bf-btn-text, #ffffff);
      background: linear-gradient(135deg, var(--bf-btn-a, #06b6d4), var(--bf-btn-b, #8b5cf6));
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 198, 255, 0.25);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 198, 255, 0.35), 0 0 20px rgba(168, 85, 247, 0.25);
    }

    .action-btn--ghost {
      background: rgba(12, 18, 38, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #22d3ee;
      box-shadow: none;
    }

    .action-btn--ghost:hover {
      border-color: rgba(0, 229, 255, 0.55);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }

    .reports-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .report-section {
      padding: 24px;
      border-radius: 20px;
      background: rgba(12, 18, 38, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .report-section:hover {
      border-color: rgba(0, 229, 255, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35), 0 0 30px rgba(168, 85, 247, 0.08);
    }

    .report-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .report-section-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .report-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: #8888aa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .report-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .report-item {
      padding: 18px;
      border-radius: 14px;
      background: rgba(8, 12, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .report-item:hover {
      border-color: rgba(0, 229, 255, 0.3);
      transform: translateY(-2px);
    }

    .report-item-title {
      margin: 0 0 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #e8e8ff;
      line-height: 1.4;
    }

    .report-item-meta {
      margin: 0 0 10px;
      font-size: 0.78rem;
      color: #8888aa;
      line-height: 1.5;
    }

    .report-item-body {
      margin: 0;
      font-size: 0.82rem;
      color: #8892b8;
      line-height: 1.6;
    }

    .report-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: #22d3ee;
    }

    .empty-state {
      padding: 24px;
      border-radius: 14px;
      border: 1px dashed rgba(168, 85, 247, 0.35);
      background: rgba(168, 85, 247, 0.06);
      text-align: center;
    }

    .empty-state p {
      margin: 0 0 14px;
      font-size: 0.9rem;
      color: #8892b8;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .page { padding: 24px 16px 48px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
      .agent-header { gap: 16px; }
      .report-items { grid-template-columns: 1fr; }
    }
  
    .agent-avatar{border-color:rgba(163,230,53,0.55);background:linear-gradient(135deg,rgba(163,230,53,0.2),rgba(168,85,247,0.12));box-shadow:0 0 24px rgba(0,229,255,0.18),0 0 32px rgba(168,85,247,0.12);}
  </style>
</head>
<body>
  <div class="page">
    <nav class="top-nav">
      <a class="back-link" href="ai-agents.html">← Agent Directory</a>
      <span class="brand-badge">BizForce AI</span>
    </nav>
    <header class="agent-header">
      <div class="agent-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
      <div class="agent-header-text">
        <h1 class="agent-title">Vertical Marketing Agent</h1>
        <p class="agent-subtitle">Marketing built for one industry vertical — its language, its channels, its objections.</p>
      </div>
    </header>
    <section class="context-card" aria-label="Business Profile Context">
      <h2 class="section-label">Business Profile Context</h2>
      <div class="context-grid" id="businessContextGrid"><p style="color:#8892b8;font-size:.85rem;margin:0;grid-column:1/-1">Loading…</p></div>
      
      <div class="research-goals"><div class="context-grid" id="liveAgentStats"></div></div>
    </section>
    <div class="toolbar">
      <div class="toolbar-meta">Last run: <strong id="lastRunText">—</strong></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="button" class="action-btn action-btn--ghost" id="refreshBtn">Refresh Data</button>
        <a class="action-btn" href="dashboard.html">Open Dashboard</a>
      </div>
    </div>
  </div>
  <script>
    /* SERVER ONLY. scripts/agent-profile.js reads the business context from
       GET /api/business-profile and "Last run" from this agent's newest
       ai_tasks row; applyLiveAgentData reads /api/agents/vertical_marketing. Nothing on
       this page reads bf_executive_memory, bf_executive_agent_memory or this
       agent's key in them: what they held was written by the dashboard's
       removed simulations, never by a run. */
    function applyLiveAgentData() {
      var API_URL = "https://dynamic-prosperity-production-5382.up.railway.app";
      var token = localStorage.getItem("bf_token");
      if (!token) { return; }

      /* WHERE THE TILES GO, found or made in one place so that a failed load
         reports itself in the same spot a successful one would have drawn. */
      function liveStatsSlot() {
        return document.getElementById("liveAgentStats");
      }

      function clearLiveStatsFailure() {
        var failEl = document.getElementById("liveAgentStatsFail");
        if (failEl && failEl.parentNode) { failEl.parentNode.removeChild(failEl); }
      }

      /* A FAILED LOAD SAYS SO. This used to end in an empty .catch, so a load
         that failed drew nothing at all — the same as an account with no agent
         row — and nobody could tell a broken request from no activity. Tiles
         already drawn by an earlier successful load are left in place; they
         were true when drawn. */
      function showLiveStatsFailure() {
        var slot = liveStatsSlot();
        if (!slot) { return; }
        clearLiveStatsFailure();

        var failEl = document.createElement("div");
        failEl.id = "liveAgentStatsFail";
        failEl.style.gridColumn = "1 / -1";

        var msgEl = document.createElement("div");
        msgEl.className = "ap-msg err";
        msgEl.textContent = "This agent's saved name could not be loaded — the request failed, so the default name is shown.";

        var retryBtn = document.createElement("button");
        retryBtn.type = "button";
        retryBtn.className = "ap-btn";
        retryBtn.textContent = "Try Again";
        retryBtn.addEventListener("click", function () {
          /* NO TOKEN, NO REQUEST. applyLiveAgentData returns before fetching
             when the token is gone, so nothing would ever come back to redraw
             this button. Said here instead, and the button left usable.
             Redirecting to sign in is bf-session.js's decision, not this one. */
          if (!localStorage.getItem("bf_token")) {
            msgEl.textContent = "This agent's saved name could not be loaded — your session has ended, so sign in again.";
            return;
          }

          retryBtn.disabled = true;
          retryBtn.textContent = "Retrying…";

          try {
            applyLiveAgentData();
          } catch (e) {
            // A throw before the request is made would otherwise strand the
            // button the same way.
            retryBtn.disabled = false;
            retryBtn.textContent = "Try Again";
          }
        });

        failEl.appendChild(msgEl);
        failEl.appendChild(retryBtn);
        slot.appendChild(failEl);
      }

      /* THE UNDERSCORE KEY, not the hyphenated filename. This is the one line
         in applyLiveAgentData that is per-agent rather than boilerplate, and
         left as the template's it would fetch the Publicist's ai_agents row and
         quietly overwrite this page's title, subtitle and stat tiles with
         theirs — silently, because the whole call ends in an empty .catch.
         The route is /api/agents/:type and the type is vertical_marketing;
         vertical-marketing is only ever a file name. */
      fetch(API_URL + "/api/agents/vertical_marketing", {
        method: "GET",
        headers: { "Authorization": "Bearer " + token }
      })
        .then(function (response) {
          /* 404 is this route's answer for an account with no agent row: an
             empty result, not a failure, and it still draws nothing. Every
             other non-2xx is a failure and goes to the catch. */
          if (response.status === 404) { return null; }
          if (!response.ok) { throw new Error("HTTP " + response.status); }
          return response.json();
        })
        .then(function (data) {
          clearLiveStatsFailure();
          if (!data || !data.agent) { return; }
          var agent = data.agent;

          if (typeof agent.display_name === "string" && agent.display_name.trim()) {
            var titleEl = document.querySelector(".agent-title");
            if (titleEl) { titleEl.textContent = agent.display_name; }
          }

          /* The subtitle stays as written: it is this agent's one honest
             description (config/brain.js, written here by the backend's
             scripts/buildAgentDescriptions.js). agent.description is never
             shown; only the display name is the member's. */

          /* ONE STATS TRUTH. A "Tasks Completed" tile stood here, read from
             ai_agents.tasks_completed: a counter only an approved proposal
             moves, so it said 0 beside a week of real runs. This agent's
             figures are the Agent Stats tiles (scripts/agent-profile.js), read
             from /api/agents/<type>/live: ai_tasks, dry runs left out. */
        })
        .catch(function () {
          showLiveStatsFailure();
        });
    }
    function refreshPage() {
      if (typeof window.bfLoadBusinessContext === "function") window.bfLoadBusinessContext();
      if (typeof window.bfLoadLastRun === "function") window.bfLoadLastRun();
      applyLiveAgentData();
    }
    document.getElementById("refreshBtn").addEventListener("click", refreshPage);
    applyLiveAgentData();
  </script>
<script>
window.AGENT_PROFILE_CONFIG = {
  agentType:   "vertical_marketing",
  agentLabel:  "Vertical Marketing Agent",
  accentColor: "#a3e635",
  /* Every value below is in allowedTaskTypes in server.js. That is a hard
     requirement: POST /api/ai/tasks rejects an unlisted task_type with a 400,
     so an invented one would put a dropdown option here that always fails.

     allowedTaskTypes also lists vertical_positioning, channel_research and
     objection_handling, but none of the three has an instruction of its own in
     taskInstructions, so each would run general's instruction under its own
     name. This dropdown keeps the nearest types that do have one —
     brand_narrative carries positioning, content_plan carries messaging — and
     the labels say what the work is rather than what the constant is called.
     Positioning (with the channels its buyers use) and objection handling are
     the two tools below, each on its own route. */
  taskTypes: [
    { value: "market_research",    label: "Industry Research" },
    { value: "brand_narrative",    label: "Vertical Positioning" },
    { value: "content_plan",       label: "Vertical Messaging" },
    { value: "competitive_intel",  label: "Competitor Proof Points" },
    { value: "campaign_plan",      label: "Vertical Campaign Plan" },
    { value: "general",            label: "General Task" }
  ],
  tools: [
    {
      "id": "positioning",
      "label": "Vertical Positioning",
      "runLabel": "Write the positioning",
      "description": "Positioning in the trade's own language, plus the channels its buyers use. States how well the model actually knows the vertical.",
      "fields": [
        {
          "name": "industry",
          "label": "Industry",
          "type": "text",
          "required": true,
          "placeholder": "Commercial roofing contractors",
          "hint": "Nothing about the industry is researched. For a niche trade the terminology may be wrong, and a practitioner would notice instantly."
        },
        {
          "name": "offering",
          "label": "What you sell",
          "type": "textarea"
        },
        {
          "name": "audience",
          "label": "Who in that industry",
          "type": "text"
        }
      ]
    },
    {
      "id": "objections",
      "label": "Objection Handling",
      "runLabel": "Work the objections",
      "description": "The objections that trade raises, how each is answered, and what proof helps — with a stated confidence level.",
      "fields": [
        {
          "name": "industry",
          "label": "Industry",
          "type": "text",
          "required": true,
          "placeholder": "Independent dental practices"
        },
        {
          "name": "offer",
          "label": "The offer",
          "type": "textarea",
          "required": true,
          "hint": "What is being sold to that industry."
        },
        {
          "name": "price_context",
          "label": "Price context",
          "type": "text"
        }
      ]
    },
    {
      "id": "claims-scan",
      "label": "Claims Scan",
      "runLabel": "Scan for claims",
      "description": "Runs the supplement claim rules and the ad-policy rules over copy you paste, and over everything you have stored here if you ask: every match with its exact text and position, and any missing disclaimer. Code only, no model call. No match is not approval.",
      "fields": [
        {
          "name": "text",
          "label": "Copy to scan",
          "type": "textarea",
          "placeholder": "Paste a label, a product description, an ad or a post",
          "hint": "Up to 6,000 characters. Leave it empty to scan only what you have stored."
        },
        {
          "name": "scan_stored",
          "label": "Stored copy",
          "type": "checkbox",
          "checkboxLabel": "Also scan everything I've stored on BizForce",
          "hint": "Your content library, marketplace listings, profile products and social drafts: the newest 200 of each."
        },
        {
          "name": "profile",
          "label": "Rules for",
          "type": "select",
          "required": true,
          "options": [
            { "value": "supplement_vitality", "label": "Dietary supplement / topical cosmetic (FDA and FTC)" }
          ]
        }
      ]
    }
  ]
};
</script>
