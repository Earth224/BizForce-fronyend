<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password - BizForce AI</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030308;color:#e8e8ff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#080812;border:1px solid rgba(0,229,255,0.2);border-radius:20px;padding:40px;width:90%;max-width:400px}
h1{background:linear-gradient(135deg,#00e5ff,#9f6bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;font-size:1.8rem;margin-bottom:6px}
p{color:#8888aa;text-align:center;font-size:0.85rem;margin-bottom:24px}
label{display:block;color:#8888aa;font-size:0.75rem;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(0,229,255,0.15);border-radius:8px;padding:11px 13px;color:#e8e8ff;font-size:0.9rem;outline:none}
input:focus{border-color:#00e5ff}
button.go{width:100%;margin-top:18px;padding:13px;background:linear-gradient(135deg,#00e5ff,#9f6bff);border:none;border-radius:10px;color:#000;font-weight:800;font-size:1rem;cursor:pointer}
button.go:disabled{opacity:0.5;cursor:default}
.err{color:#ff2d78;font-size:0.82rem;text-align:center;margin-top:10px;min-height:20px}
.ok{color:#00e5ff;font-size:0.9rem;text-align:center;line-height:1.6}
.back{text-align:center;margin-top:18px}
.back a{color:#8888aa;font-size:0.8rem;text-decoration:none}
.back a:hover{color:#00e5ff}
</style></head><body>
<div class="box">
  <h1>New Password</h1>
  <p id="sub">Choose a new password for your account</p>

  <div id="form">
    <label>New Password</label>
    <input id="p1" type="password" placeholder="Min 8 characters" autocomplete="new-password">
    <label>Confirm New Password</label>
    <input id="p2" type="password" placeholder="Type it again" autocomplete="new-password">
    <button class="go" id="btn" onclick="submit()">Reset Password</button>
  </div>

  <div id="done" style="display:none"></div>
  <div class="err" id="err"></div>
  <div class="back"><a href="/index.html">Back to sign in</a></div>
</div>

<script>
const A = 'https://dynamic-prosperity-production-5382.up.railway.app';

// The token arrives as ?token=... on the link in the reset email. Read once at
// load: if it is absent the page cannot do anything, so the form is hidden
// rather than left there to fail on submit.
const token = new URLSearchParams(window.location.search).get('token') || '';

if (!token) {
  document.getElementById('form').style.display = 'none';
  document.getElementById('sub').textContent = 'This link is missing its reset token';
  err('Open the link exactly as it appears in your email, or request a new one from the sign-in page.');
}

function err(m) {
  document.getElementById('err').textContent = m;
}

async function submit() {
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;

  // Checked here as well as on the server. The server is the authority — this
  // only saves a round trip and gives a faster answer.
  if (!p1 || !p2) return err('Fill in both fields');
  if (p1.length < 8) return err('Password must be at least 8 characters');
  if (p1 !== p2) return err('The two passwords do not match');

  err('');
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const r = await fetch(A + '/api/auth/password-reset/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: p1 })
    });
    const d = await r.json();

    if (!r.ok) {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      return err(d.error || 'Could not reset your password');
    }

    // Success. The form goes away entirely — a reset token is single use, so
    // leaving a button that can only fail from here would be worse than no
    // button. No auto-redirect either: the person should read what happened.
    document.getElementById('form').style.display = 'none';
    document.getElementById('sub').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    document.getElementById('done').innerHTML =
      '<div class="ok">Your password has been reset.<br>You can now sign in with your new password.</div>';
  } catch (x) {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
    err('Connection error: ' + x.message);
  }
}

// Enter submits, matching what people expect of a two-field form.
document.getElementById('p2').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submit();
});
</script>
<script src="/scripts/termaximus-presence.js"></script>
</body></html>
