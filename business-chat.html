<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizForce AI — Business Chat</title>
  <script src="/scripts/bf-session.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: #e8e8ff;
      background: #070b18;
    }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(0, 229, 255, 0.14), transparent 38%),
        radial-gradient(circle at 85% 90%, rgba(168, 85, 247, 0.18), transparent 40%),
        #070b18;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(0, 229, 255, 0.25);
      background: rgba(12, 18, 38, 0.6);
      color: #22d3ee;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .back-link:hover {
      border-color: rgba(0, 229, 255, 0.55);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
      transform: translateY(-1px);
    }

    .brand-badge {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .agent-header {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .agent-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.18), rgba(168, 85, 247, 0.22));
      border: 2px solid rgba(0, 229, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.18), 0 0 32px rgba(168, 85, 247, 0.12);
      flex-shrink: 0;
    }

    .agent-avatar svg {
      width: 34px;
      height: 34px;
      opacity: 0.85;
    }

    .agent-header-text { flex: 1; min-width: 220px; }

    .agent-title {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00e5ff 0%, #7b2ff7 60%, #a855f7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .agent-subtitle {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #8892b8;
    }
  </style>
</head>
<body>
  <div class="page">

    <nav class="top-nav">
      <a class="back-link" href="/dashboard.html">&#8592; Dashboard</a>
      <span class="brand-badge">BizForce AI</span>
    </nav>

    <header class="agent-header">
      <div class="agent-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="agent-header-text">
        <h1 class="agent-title">Business Chat</h1>
        <p class="agent-subtitle">Your business-aware AI guide.</p>
      </div>
    </header>

    <style>
      .chat-msg {
        max-width: 78%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.92rem;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .chat-msg-user {
        align-self: flex-end;
        background: linear-gradient(135deg, rgba(6,182,212,0.18), rgba(139,92,246,0.18));
        border: 1px solid rgba(0, 229, 255, 0.25);
        color: #e8e8ff;
      }
      .chat-msg-assistant {
        align-self: flex-start;
        background: rgba(8, 12, 28, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #ccd0e8;
      }
    </style>

    <script>
      var API = "https://dynamic-prosperity-production-5382.up.railway.app";

      function addMessage(role, content) {
        var el = document.createElement("div");
        el.className = "chat-msg " + (role === "user" ? "chat-msg-user" : "chat-msg-assistant");
        el.textContent = content;
        document.getElementById("chatMessages").appendChild(el);
        var box = document.getElementById("chatMessages");
        box.scrollTop = box.scrollHeight;
        return el;
      }

      /* A notice is NOT a message from the model, and must never be dressed as
         one. The page has no dedicated notice style and none is being added, so
         this uses the base .chat-msg rule on its own — without the
         .chat-msg-assistant or .chat-msg-user modifier that draws a speech
         bubble. It lands in the transcript as unbubbled, full-width system text
         and carries data-role="system" for anything that later reads the DOM. */
      function addNotice(content) {
        var el = document.createElement("div");
        el.className = "chat-msg";
        el.setAttribute("data-role", "system");
        el.textContent = content;
        var box = document.getElementById("chatMessages");
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
        return el;
      }

      /* The body is read as text and parsed by hand rather than through
         r.json(). A 402, a 429 and a 500 are all answers the server meant to
         send, and r.json() rejects on the ones that carry no body at all —
         which would route a real, readable status into the network-failure
         branch and report "your message did not get through" about a message
         that arrived and was refused. */
      function readResponse(r) {
        return r.text().then(function (body) {
          var data = null;
          try { data = body ? JSON.parse(body) : null; } catch (e) { data = null; }
          return { status: r.status, ok: r.ok, data: data };
        }, function () {
          return { status: r.status, ok: r.ok, data: null };
        });
      }

      function sendMessage() {
        var input = document.getElementById("chatInput");
        var btn   = document.getElementById("chatSendBtn");
        var text  = input.value.trim();
        if (!text) return;

        var userEl = addMessage("user", text);
        input.value = "";
        input.disabled = true;
        btn.disabled = true;
        btn.textContent = "Sending…";

        var thinkingEl = addMessage("assistant", "Thinking…");

        /* Every outcome below goes through this first. The composer was left
           disabled on any path the old handler did not anticipate, which is the
           one failure a user cannot work around — they cannot even retype. */
        function finish() {
          if (thinkingEl && thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
          input.disabled = false;
          btn.disabled = false;
          btn.textContent = "Send";
        }

        fetch(API + "/api/business-chat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + (localStorage.getItem("bf_token") || ""),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text })
        })
        .then(readResponse, function () { return { networkError: true }; })
        .then(function (res) {
          finish();

          /* Nothing was sent. The user's words are the only copy that exists,
             so they go back into the composer, and the bubble comes out of the
             transcript — a bubble sitting in the log is the page saying the
             message was delivered. */
          if (res.networkError) {
            if (userEl && userEl.parentNode) userEl.parentNode.removeChild(userEl);
            if (!input.value) input.value = text;
            addNotice("Your message did not get through and was not sent. The text is back in the box — check your connection and try again.");
            return;
          }

          var data = res.data || {};
          /* Every refusal from this API carries its message in `error`. It is
             shown verbatim: the server wrote it for a person to read, and it
             names things this page cannot know — which limit was hit, when it
             resets, why the plan is inactive. */
          var serverText = (typeof data.error === "string" && data.error) ? data.error : "";

          /* Not entitled. Refused before the model was ever called, so this is
             the billing system talking, not the assistant. */
          if (res.status === 402) {
            addNotice(serverText || "This account does not have an active subscription.");
            addNotice("You can review or restart your plan on the Billing page: /billing.html");
            return;
          }

          /* Session over. scripts/bf-session.js wraps window.fetch, and by the
             time a 401 reaches here it has already tried the refresh token and
             already started the redirect to /app.html?session=expired. Clearing
             the token here too would only race it. */
          if (res.status === 401) {
            addNotice("Your session has ended. Taking you to the sign-in page.");
            return;
          }

          if (res.status === 429) {
            addNotice(serverText || "The rate limit for this account has been reached. Try again later.");
            return;
          }

          /* Anything else that is not a 2xx. It says what is known — the
             request failed, with this status — and says nothing at all about
             the model, because from here there is no way to tell whether it
             ran. */
          if (!res.ok) {
            addNotice("The request failed with HTTP " + res.status + "." + (serverText ? " " + serverText : ""));
            return;
          }

          if (typeof data.reply === "string" && data.reply) {
            addMessage("assistant", data.reply);
            return;
          }

          /* A 2xx with no reply in it. The old text said that no response was
             received, in an assistant bubble, which reads as the model choosing
             to say nothing. The server responded; the response was missing its
             reply. */
          addNotice("The server answered, but its response contained no reply.");
        });
      }

      function loadHistory() {
        try {
          fetch(API + "/api/business-chat", {
            headers: { "Authorization": "Bearer " + (localStorage.getItem("bf_token") || "") }
          })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) {
            if (!data || !Array.isArray(data.messages)) return;
            data.messages.forEach(function(msg) {
              addMessage(msg.role, msg.content);
            });
          })
          .catch(function() {});
        } catch (e) {}
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("chatSendBtn").addEventListener("click", sendMessage);
        document.getElementById("chatInput").addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
        loadHistory();
      });
    </script>

    <div id="chatBody">

      <div id="chatMessages" style="
        min-height: 420px;
        max-height: 560px;
        overflow-y: auto;
        padding: 24px;
        border-radius: 20px;
        background: rgba(12, 18, 38, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 16px;
      "></div>

      <div style="display: flex; gap: 10px; align-items: stretch;">
        <input
          id="chatInput"
          type="text"
          placeholder="Ask your business guide anything..."
          style="
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            background: rgba(8, 12, 28, 0.9);
            color: #e8e8ff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
          "
        />
        <button
          id="chatSendBtn"
          type="button"
          style="
            padding: 14px 26px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.25s;
            box-shadow: 0 4px 20px rgba(0, 198, 255, 0.25);
            white-space: nowrap;
          "
        >Send</button>
      </div>

    </div>

  </div>
<script src="/scripts/termaximus-presence.js"></script>
<script src="/scripts/termaximus-guide.js"></script>
