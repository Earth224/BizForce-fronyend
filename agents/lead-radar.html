  <title>BizForce AI — Lead Radar</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070b18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- NAMED (Nov 23 2026, LR-2): Lead Radar for every member, built to the owner's canvas row 6 (LeadsHome, LeadsReply,
       LeadsFingerprint; scripts/designSpec.js LEADS). The site's own fonts and music icon are kept; only the Leads and
       Fingerprint tabs are drawn; the bottom bar is the site's (scripts/bf-tabbar.js). Every control is a 44 px target
       with the board's smaller face drawn inside it. BEFORE: the owner's single-account radar (Chart.js, scores, Copy).
       NAMED (Nov 24 2026, LR-3): + the Inbound tab, built to the owner's canvas row 6 "Inbound: everything coming to you"
       (LeadsInbound; scripts/designSpec.js LEADS.INBOUND): YOUR PIPELINE, the New, Talking, Won and Lost chips, and each item
       with its icon, kind, who, age, summary and status pill. The tabs are Leads, Inbound and Fingerprint (Get found is LR-4). -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #070b18; color: #e6eaf5; font-family:system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    a { color: var(--bf-accent-a, #22d3ee); }
    html.lr-locked { overflow: hidden; }
    .lr-page { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding-bottom: 24px; }   /* over the theme backdrop (html::before, body::before: fixed, z 0) */

    /* the header: Back, the mark, the title, Radar settings */
    .lr-head { display: flex; align-items: center; gap: 6px; padding: 12px 8px 4px; }
    .lr-hbtn { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: transparent; color: #e6eaf5; cursor: pointer; text-decoration: none; }
    .lr-hbtn[hidden] { display: none; }
    .lr-set { color: #c9d1e6; }
    .lr-hbtn:focus-visible, .lr-tb:focus-visible, .lr-chip:focus-visible, .lr-btn:focus-visible, .lr-sw:focus-visible, .lr-big:focus-visible { outline: 2px solid var(--bf-accent-a, #22d3ee); outline-offset: 2px; }
    .lr-mark { flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #0f2a3a; color: var(--bf-accent-a, #22d3ee); }
    .lr-title { flex: 1; min-width: 0; margin: 0; font: 700 18px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .brand-badge { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: linear-gradient(90deg, var(--bf-mark-a, #22d3ee)var(--bf-mark-mid, ), var(--bf-mark-b, #a855f7)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-right: 8px; }

    /* the tabs: Leads and Fingerprint */
    .lr-tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
    .lr-tabs[hidden] { display: none; }
    .lr-tb { flex: none; min-width: 44px; height: 44px; margin: -2px 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .lr-tbf { display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 20px; color: #a9b3cc; font: 600 14px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; white-space: nowrap; }
    .lr-tb[aria-selected="true"] .lr-tbf { background: #0f2a3a; color: var(--bf-accent-a, #22d3ee); }

    .lr-main { display: flex; flex-direction: column; gap: 10px; padding: 0 12px; }
    .lr-main[hidden] { display: none; }
    .lr-fp { gap: 12px; padding: 0 16px; }

    .lr-card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; border: 1px solid #1e2848; background: #0b1022; }
    .lr-card.is-yt { opacity: .8; }
    .lr-row { display: flex; align-items: center; gap: 10px; }
    .lr-stats { display: flex; gap: 8px; }
    .lr-stat { flex: 1; align-items: center; gap: 2px; padding: 10px; }
    .lr-num { font: 700 20px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .lr-num.is-won { color: #f5c46b; }
    .lr-slbl { font-size: 12px; color: #a9b3cc; text-align: center; }

    /* the chips: a 34 px face in a 44 px target; the source row swipes, the Fingerprint's rows wrap */
    /* The chips swipe in one row; the scrollbar is the site's one rule (checkScrollbars), never styled here. */
    .lr-chips { display: flex; gap: 8px; margin: -5px 0; padding: 5px 0; overflow-x: auto; }
    .lr-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .lr-chip { flex: none; min-width: 44px; height: 44px; margin: -5px 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .lr-chipf { display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #2b3a6b; background: #0e1428; color: #c9d1e6; font: 500 12.5px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; white-space: nowrap; }
    .lr-chip[aria-pressed="true"] .lr-chipf { border-color: var(--bf-accent-a, #22d3ee); background: #0f2a3a; color: var(--bf-accent-a, #22d3ee); }
    .lr-chip:disabled { cursor: default; }

    /* a lead */
    .lr-badge { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font: 700 10.5px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; letter-spacing: 1px; white-space: nowrap; }
    .lr-b-need { background: var(--bf-accent-a, #22d3ee); color: #070b18; }
    .lr-b-bsky { background: #1b2350; color: #b79cfa; }
    .lr-b-yt { background: #3a1414; color: #fca5a5; }
    .lr-b-thr { background: #1f2433; color: #e6eaf5; }
    .lr-meta { min-width: 0; font-size: 12px; color: #a9b3cc; }
    .lr-text { font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
    .lr-match { font-size: 12px; color: #6ee7b7; }
    .lr-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .lr-btn { flex: none; display: inline-flex; align-items: center; min-width: 44px; height: 44px; margin: -3px 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; text-decoration: none; }
    .lr-btnf { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2b3a6b; color: #c9d1e6; font: 600 13px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; white-space: nowrap; }
    .lr-btn.is-p .lr-btnf { border: 0; background: var(--bf-accent-a, #22d3ee); color: #070b18; }
    .lr-btn:disabled { cursor: default; opacity: .6; }
    .lr-note { margin: 0; font-size: 12px; color: #a9b3cc; }
    .lr-note.is-err { color: #fca5a5; }
    .lr-foot { margin: 0; padding: 0 10px; font-size: 12px; line-height: 1.4; color: #8e9bbf; text-align: center; }
    .lr-empty { margin: 0; font-size: 14px; line-height: 1.45; color: #c9d1e6; }
    .lr-state[hidden] { display: none; }
    .lr-state-t { margin: 0; font: 700 16px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }

    /* the Fingerprint */
    .lr-intro { margin: 0; font-size: 13px; line-height: 1.45; color: #c9d1e6; }
    .lr-lbl { margin: 0; font: 600 11px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; letter-spacing: 1.6px; color: #8e9bbf; text-transform: uppercase; }
    .lr-addrow { display: flex; gap: 8px; align-items: center; }
    .lr-in { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #2b3a6b; background: #070b18; color: #e6eaf5; font: 15px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .lr-look { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .lr-look-x { flex: 1; min-width: 0; }
    .lr-look-t { font: 600 13.5px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .lr-look-s { font-size: 12px; color: #a9b3cc; }
    .lr-sw { flex: none; display: flex; align-items: center; width: 44px; height: 44px; margin: -9px 0; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .lr-swf { position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; background: var(--bf-accent-a, #22d3ee); }
    .lr-swf::after { content: ""; position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 10px; background: #070b18; }
    .lr-sw[aria-checked="false"] .lr-swf { background: #2b3a6b; }
    .lr-sw[aria-checked="false"] .lr-swf::after { right: auto; left: 3px; background: #a9b3cc; }

    /* the reply sheet (LeadsReply): over the page, under the site's bottom bar, as the board draws it */
    .lr-veil { position: fixed; inset: 0; z-index: 79; background: rgba(3,5,12,0.66); }
    .lr-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; display: flex; flex-direction: column; gap: 12px; height: 640px; max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px);
      padding: 10px 16px 20px; border-radius: 22px 22px 0 0; border-top: 1px solid #2b3a6b; background: #0b1022; color: #e6eaf5; overflow-y: auto; }
    html.bf-tabbar-on .lr-sheet { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .lr-veil[hidden], .lr-sheet[hidden] { display: none; }
    .lr-grab { flex: none; align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #2b3a6b; }
    .lr-sh-title { flex: 1; min-width: 0; margin: 0; font: 700 17px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .lr-close { color: #c9d1e6; }
    .lr-shbody { display: flex; flex-direction: column; gap: 12px; }
    .lr-quote { margin: 0; padding: 6px 10px; border-left: 3px solid var(--bf-accent-b, #8b5cf6); font-size: 13.5px; line-height: 1.4; color: #c9d1e6; overflow-wrap: anywhere; }
    .lr-draft { display: block; width: 100%; min-height: 132px; padding: 12px; border-radius: 14px; border: 1px solid var(--bf-accent-a, #22d3ee); background: #070b18; color: #e6eaf5; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; resize: vertical; }
    .lr-checks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .lr-checks .lr-row[hidden] { display: none; }
    .lr-ok { color: #6ee7b7; }
    .lr-linkrow { justify-content: space-between; padding: 8px 0; font-size: 13.5px; }
    .lr-big { flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 14px; border-radius: 24px; border: 1px solid #2b3a6b; background: transparent; color: #c9d1e6; font: 600 13px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; cursor: pointer; text-decoration: none; }
    .lr-big.is-p { flex: 1.4; border: 0; background: var(--bf-accent-a, #22d3ee); color: #070b18; }
    .lr-big:disabled { cursor: default; opacity: .6; }
    .lr-sfoot { margin: 0; font-size: 12px; line-height: 1.4; color: #8e9bbf; text-align: center; }

    /* NAMED (Nov 24 2026, LR-3): Inbound (LeadsInbound): the pipeline, the items, the status pill and its menu */
    .lr-pipe { padding: 10px 12px; gap: 8px; }
    .lr-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #1e2848; }
    .lr-bar-new { background: var(--bf-accent-a, #22d3ee); }
    .lr-bar-talking { background: var(--bf-accent-b, #8b5cf6); }
    .lr-bar-won { background: #f5c46b; }
    .lr-pcounts { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .lr-pc-new { color: var(--bf-accent-a, #22d3ee); }
    .lr-pc-talking { color: #b79cfa; }
    .lr-pc-won { color: #f5c46b; }
    .lr-item { position: relative; flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 10px; }
    .lr-open { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 10px; min-height: 44px; color: inherit; text-decoration: none; }
    .lr-open:focus-visible, .lr-pill:focus-visible, .lr-mi:focus-visible { outline: 2px solid var(--bf-accent-a, #22d3ee); outline-offset: 2px; }
    .lr-ico { flex: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
    .lr-ico-message { background: #0f2a3a; color: var(--bf-accent-a, #22d3ee); }
    .lr-ico-i_can_help, .lr-ico-lead_reply { background: #1b2350; color: #b79cfa; }
    .lr-ico-sale, .lr-ico-campaign, .lr-ico-tip { background: #2a2410; color: #f5c46b; }
    .lr-ico-card_lead { background: #14302a; color: #6ee7b7; }
    .lr-ix { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .lr-ih { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .lr-ik { flex: none; font: 600 13px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .lr-is { font-size: 13.5px; line-height: 1.35; color: #c9d1e6; overflow-wrap: anywhere; }
    .lr-pill { flex: none; display: flex; align-items: center; justify-content: flex-end; min-width: 44px; height: 44px; margin: -11px 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .lr-s-new { background: var(--bf-accent-a, #22d3ee); color: #070b18; }
    .lr-s-talking { background: #b79cfa; color: #070b18; }
    .lr-s-won { background: #f5c46b; color: #070b18; }
    .lr-s-lost { background: #2b3a6b; color: #c9d1e6; }
    .lr-iacts { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: 50px; }
    .lr-added { font-size: 12px; color: #6ee7b7; }
    .lr-menu { position: absolute; top: 40px; right: 8px; z-index: 5; display: flex; flex-direction: column; min-width: 170px; padding: 6px; border-radius: 14px; border: 1px solid #2b3a6b; background: #0e1428; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .lr-menu[hidden] { display: none; }
    .lr-mi { height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #e6eaf5; font: 600 13.5px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; text-align: left; cursor: pointer; }
    .lr-mi:hover { background: #0f2a3a; }

    @media (max-width: 760px) {
      .brand-badge { display: none; }
    }
    @media (min-width: 761px) {
      .lr-page { padding-top: 16px; }
      .lr-sheet { left: 50%; right: auto; top: 50%; bottom: auto; width: min(480px, calc(100vw - 32px)); height: auto; max-height: calc(100vh - 48px); border: 1px solid #2b3a6b; border-radius: 22px; transform: translate(-50%, -50%); }
      .lr-grab { display: none; }
    }
  </style>
<link rel="stylesheet" href="/css/bf-phone.css"><!-- NAMED (Nov 19 2026, PH1): the phone layout; every rule is inside @media (max-width: 760px), so the desktop is unchanged. -->
</head>
<body>
  <div class="lr-page" id="lrPage">
    <header class="lr-head">
      <a class="lr-hbtn" href="/dashboard.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span class="lr-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><path d="M12 12l6-6"></path><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle></svg></span>
      <h1 class="lr-title">Lead Radar</h1>
      <span class="brand-badge" data-bf-boombox-anchor>BizForce AI</span>
      <button type="button" class="lr-hbtn lr-set" id="lrSettings" aria-label="Radar settings" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
    </header>

    <div class="lr-tabs" role="tablist" id="lrTabs" aria-label="Lead Radar" hidden>
      <button type="button" role="tab" class="lr-tb" id="lrTabLeads" aria-selected="true" aria-controls="lrLeads" data-tab="leads"><span class="lr-tbf">Leads</span></button>
      <button type="button" role="tab" class="lr-tb" id="lrTabIn" aria-selected="false" aria-controls="lrIn" data-tab="inbound" tabindex="-1"><span class="lr-tbf">Inbound</span></button>
      <button type="button" role="tab" class="lr-tb" id="lrTabFp" aria-selected="false" aria-controls="lrFp" data-tab="fingerprint" tabindex="-1"><span class="lr-tbf">Fingerprint</span></button>
    </div>

    <div class="lr-main" id="lrStateWrap">
      <div class="lr-card lr-state" id="lrState" hidden></div>
    </div>

    <section class="lr-main" id="lrLeads" role="tabpanel" aria-labelledby="lrTabLeads" hidden>
      <div class="lr-stats" id="lrStats">
        <div class="lr-card lr-stat"><span class="lr-num" id="lrStatNew">0</span><span class="lr-slbl">new this week</span></div>
        <div class="lr-card lr-stat"><span class="lr-num" id="lrStatReplied">0</span><span class="lr-slbl">you replied</span></div>
        <div class="lr-card lr-stat"><span class="lr-num is-won" id="lrStatWon">0</span><span class="lr-slbl">won</span></div>
      </div>
      <div class="lr-chips" id="lrChips" role="group" aria-label="Where the leads came from"></div>
      <div class="lr-main" id="lrList" style="padding:0" aria-live="polite"></div>
      <p class="lr-foot">You approve every reply. BizForce never messages anyone for you.</p>
    </section>

    <section class="lr-main" id="lrIn" role="tabpanel" aria-labelledby="lrTabIn" hidden>
      <div class="lr-card lr-pipe">
        <p class="lr-lbl lr-plbl">Your pipeline</p>
        <div class="lr-bar" id="lrBar" role="img" aria-label="Your pipeline"><span class="lr-bar-new"></span><span class="lr-bar-talking"></span><span class="lr-bar-won"></span></div>
        <div class="lr-pcounts"><span class="lr-pc-new" id="lrPcNew">New 0</span><span class="lr-pc-talking" id="lrPcTalking">Talking 0</span><span class="lr-pc-won" id="lrPcWon">Won 0</span></div>
      </div>
      <div class="lr-chips" id="lrInChips" role="group" aria-label="Pipeline stage"></div>
      <p class="lr-note is-err" id="lrInMsg" role="status" hidden></p>
      <div class="lr-main" id="lrInList" style="padding:0" aria-live="polite"></div>
    </section>

    <section class="lr-main lr-fp" id="lrFp" role="tabpanel" aria-labelledby="lrTabFp" hidden>
      <p class="lr-intro">Built for you from your profile, listings and posts. It updates by itself. Change anything.</p>
      <p class="lr-note" id="lrFpMsg" role="status" hidden></p>
      <div class="lr-main" id="lrFpBody" style="padding:0;gap:12px"></div>
    </section>
  </div>

  <div class="lr-veil" id="lrVeil" hidden></div>
  <div class="lr-sheet" id="lrSheet" role="dialog" aria-modal="true" aria-labelledby="lrSheetTitle" hidden>
    <div class="lr-grab" aria-hidden="true"></div>
    <div class="lr-row"><h2 class="lr-sh-title" id="lrSheetTitle">Your reply on Bluesky</h2><button type="button" class="lr-hbtn lr-close" id="lrSheetClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
    <div class="lr-shbody" id="lrSheetBody"></div>
  </div>

  <script>
  (function () {
    "use strict";
    var API = (typeof window.API_URL === "string" && window.API_URL) || "https://dynamic-prosperity-production-5382.up.railway.app";
    function tok() { try { return localStorage.getItem("bf_token") || ""; } catch (e) { return ""; } }
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    /* One request to the member routes (lib/routeAccess.js M). 401: signed out; 402: a free account (the members panel). */
    function call(method, path, body) {
      var h = { "Authorization": "Bearer " + tok() };
      if (body !== undefined) h["Content-Type"] = "application/json";
      return fetch(API + path, { method: method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d || {} }; }); })
        .catch(function () { return { ok: false, status: 0, data: {} }; });
    }
    function refused(res) {
      if (res.status === 401) { showState("signed_out"); return true; }
      if (res.status === 402) { showState("members_only"); if (window.bfAccess && window.bfAccess.showPanel) window.bfAccess.showPanel(); return true; }

      // and "No hard sell" is tested again on every edit with the server's own list (hard_sell_words).
      S.hardSellWords = Array.isArray(d.hard_sell_words) ? d.hard_sell_words : [];
      var checks = [["answers", c.answers, "Answers what they asked"], ["no_hard_sell", c.no_hard_sell, "No hard sell, no promises"], ["invited", c.invited, "They asked the room, so a reply is welcome"]]
        .map(function (x) { return '<div class="lr-row" data-check="' + x[0] + '"' + (x[1] === true ? "" : " hidden") + '><span class="lr-ok" aria-hidden="true">&#10003;</span>' + esc(x[2]) + '</div>'; }).join("");
      return '<blockquote class="lr-quote">' + esc(l.text) + '</blockquote>' +
        '<label class="lr-lbl" for="lrDraft">Draft (edit anything)</label>' +
        '<textarea class="lr-draft" id="lrDraft" maxlength="300" spellcheck="true">' + esc(d.draft || "") + '</textarea>' +
        (checks ? '<div class="lr-checks">' + checks + '</div>' : "") +
        '<div class="lr-row lr-linkrow"><span id="lrLinkLabel">Add a link to my listing</span><button type="button" class="lr-sw" id="lrLinkSw" role="switch" aria-checked="' + (S.sheetLink ? "true" : "false") + '" aria-labelledby="lrLinkLabel"><span class="lr-swf"></span></button></div>' +
        '<div class="lr-row"><button type="button" class="lr-big" id="lrAgain">Write it again</button><button type="button" class="lr-big is-p" id="lrPost">Post my reply</button></div>' +
        '<p class="lr-note is-err" id="lrSheetMsg" role="status" hidden></p>' +
        '<p class="lr-sfoot">' + esc(who) + '. One reply per post, up to 5 a day.</p>';
    }
    /* The same test as lib/leadReplies.js hardSell, over the server's list: a phrase standing as its own words. */
    function hardSellIn(text) {
      var t = " " + String(text || "").toLowerCase().replace(/\s+/g, " ") + " ";
      return (S.hardSellWords || []).some(function (w) {
        for (var at = t.indexOf(w); at !== -1; at = t.indexOf(w, at + 1)) {
          if (w.charAt(0) === "%" || (!/[a-z0-9]/.test(t.charAt(at - 1)) && !/[a-z0-9]/.test(t.charAt(at + w.length)))) return true;
        }
        return false;
      });
    }
    document.addEventListener("input", function (e) {
      if (!e.target || e.target.id !== "lrDraft") return;
      var row = document.querySelector('.lr-checks [data-check="no_hard_sell"]');
      if (row) row.hidden = hardSellIn(e.target.value);
    });
    function sheetMsg(t) { var m = $("lrSheetMsg"); if (!m) return; m.textContent = t || ""; m.hidden = !t; }
    function draft() {
      var l = S.sheetLead; if (!l) return;
      call("POST", "/api/leads/" + encodeURIComponent(l.id) + "/draft", { add_link: S.sheetLink }).then(function (res) {
        if (S.sheetLead !== l) return;
        if (res.status === 401 || res.status === 402) { closeSheet(); refused(res); return; }
        var code = res.data && res.data.code;
        if (res.status === 409 && (code === "not_connected" || code === "needs_reconnect")) { connectState(code, l.reply_platform || l.source); return; }
        if (res.status === 409 && code === "waiting_approval") { $("lrSheetBody").innerHTML = '<p class="lr-empty" data-state="waiting_approval">Replies on Threads wait for Meta\'s approval. Nothing was posted.</p>'; return; }
        if (!res.ok) { $("lrSheetBody").innerHTML = '<p class="lr-empty">' + esc((res.data && res.data.error) || "A draft could not be written just now. Nothing was posted.") + '</p>'; return; }
        $("lrSheetBody").innerHTML = draftHtml(l, res.data);
      });
    }
    function send() {
      var l = S.sheetLead, box = $("lrDraft"), b = $("lrPost"); if (!l || !box || S.busy) return;
      var text = box.value.trim();
      if (!text) { sheetMsg(SEND_ERRORS.bad_text); return; }
      S.busy = true; b.disabled = true; sheetMsg("");
      call("POST", "/api/leads/" + encodeURIComponent(l.id) + "/send", { text: text, add_link: S.sheetLink }).then(function (res) {
        S.busy = false; if (b) b.disabled = false;
        if (S.sheetLead !== l) return;
        if (res.status === 401 || res.status === 402) { closeSheet(); refused(res); return; }
        var code = res.data && res.data.code;
        if (res.status === 409 && (code === "not_connected" || code === "needs_reconnect")) { connectState(code, l.reply_platform || l.source); return; }
        if (!res.ok || res.data.sent !== true) { sheetMsg(SEND_ERRORS[code] || (res.data && res.data.error) || "The reply could not be posted. Nothing was sent."); return; }
        l.status = "replied"; l.can_reply = false;
        if (S.stats) S.stats.replied = (+S.stats.replied || 0) + 1;
        closeSheet(); drawStats(); drawLeads();
      });
    }
    $("lrSheetBody").addEventListener("click", function (e) {
      if (e.target.closest("#lrPost")) { send(); return; }
      if (e.target.closest("#lrAgain")) { $("lrSheetBody").innerHTML = '<p class="lr-empty">Writing a draft...</p>'; draft(); return; }
      var sw = e.target.closest("#lrLinkSw");
      if (sw) { S.sheetLink = !S.sheetLink; sw.setAttribute("aria-checked", S.sheetLink ? "true" : "false"); }
    });
    $("lrSheetClose").addEventListener("click", closeSheet);
    $("lrVeil").addEventListener("click", closeSheet);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !$("lrSheet").hidden) { e.preventDefault(); closeSheet(); }
    });

    /* ── the Fingerprint (LeadsFingerprint) ── */
    var REACH = [["city", "My city"], ["25mi", "25 miles"], ["online", "Online, anywhere"]];
    function fpMsg(t) { var m = $("lrFpMsg"); m.textContent = t || ""; m.hidden = !t; m.className = "lr-note" + (t ? " is-err" : ""); }
    function loadFingerprint() {
      $("lrFpBody").innerHTML = '<p class="lr-empty">Reading your Fingerprint...</p>';
      S.swapping = null;
      call("GET", "/api/leads/fingerprint").then(function (res) {
        if (refused(res)) return;
        if (!res.ok) { $("lrFpBody").innerHTML = '<p class="lr-empty">Your Fingerprint could not be read just now. Try again soon.</p>'; return; }
        S.fp = res.data; drawFingerprint();
      });
    }
    function lookRow(key, title, sub, control) {
      return '<div class="lr-look" data-source="' + key + '"><div class="lr-look-x"><div class="lr-look-t">' + esc(title) + '</div><div class="lr-look-s">' + esc(sub) + '</div></div>' + (control || "") + '</div>';
    }
    function sw(key, on, title) {
      return '<button type="button" class="lr-sw" role="switch" data-src="' + key + '" aria-checked="' + (on ? "true" : "false") + '" aria-label="' + esc(title) + '"><span class="lr-swf"></span></button>';
    }
    function adder(field, label) {
      return chip("", "+ Add", false, ' data-add="' + field + '" aria-label="' + esc(label) + '" aria-expanded="' + (S.editing === field ? "true" : "false") + '"');
    }
    function editor(field, placeholder) {
      if (S.editing !== field) return "";
      if (field === "categories") {
        var chosen = (S.fp.fingerprint && S.fp.fingerprint.categories) || [];
        var rest = (S.fp.all_categories || []).filter(function (c) { return chosen.indexOf(c.slug) === -1; });
        return '<div class="lr-chips" data-pick="categories">' + rest.map(function (c) { return chip(c.slug, c.name, false, ' data-pick-v="1"'); }).join("") + '</div>';
      }
      return '<form class="lr-addrow" data-form="' + field + '"><input class="lr-in" name="v" maxlength="' + (field === "place" ? 80 : 40) + '" placeholder="' + esc(placeholder) + '" aria-label="' + esc(placeholder) + '"' +
        (field === "place" ? ' value="' + esc(placeText()) + '"' : "") + '><button type="submit" class="lr-btn is-p"><span class="lr-btnf">' + (field === "place" ? "Save" : "Add") + '</span></button></form>';
    }
    function placeText() {
      var f = (S.fp && S.fp.fingerprint) || {};
      return [f.place_city, f.place_region].filter(Boolean).join(", ");
    }
    /* NAMED (Nov 24 2026, LR-2B): spare words, kept for later. A tap swaps one in; at 12 words the member then taps the
       word it replaces (that word goes back to the spare words). POST /api/leads/fingerprint/spare/swap does the work. */
    var MAX_WORDS = 12;
    function spareRow(d, f) {
      var spare = d.spare_words || [];
      if (d.spare_words_readable === false) return '<p class="lr-note" data-spare-note>Your spare words could not be read just now.</p>';
      if (!spare.length) return "";
      var full = (f.keywords || []).length >= MAX_WORDS;
      var note = S.swapping ? "Tap the word to replace with " + S.swapping + "." : (full ? "Your 12 words are full. Tap a spare word, then the word it replaces." : "Tap a spare word to add it.");
      return '<p class="lr-lbl" id="lrSpareLbl">Spare words</p>' +
        '<p class="lr-note" data-spare-note>' + esc(note) + '</p>' +
        '<div class="lr-wrap" data-spare role="group" aria-labelledby="lrSpareLbl">' + spare.map(function (w) { return chip(w, w, S.swapping === w, ' data-spare-v="1" aria-label="Swap in ' + esc(w) + '"'); }).join("") +
        (S.swapping ? chip("", "Cancel", false, ' data-spare-cancel="1"') : "") + '</div>';
    }
    function swapSpare(add, replace) {
      fpMsg("");
      var body = { add: add }; if (replace) body.replace = replace;
      return call("POST", "/api/leads/fingerprint/spare/swap", body).then(function (res) {
        if (refused(res)) return;
        if (!res.ok) {
          if (res.data && res.data.code === "pick_one") { S.swapping = add; drawFingerprint(); return; }
          S.swapping = null; fpMsg((res.data && res.data.error) || "That word could not be swapped in just now. Try again."); drawFingerprint(); return;
        }
        S.fp = res.data; S.swapping = null; S.editing = null; drawFingerprint();
        if (S.loaded) loadLeads();
      });
    }
    function drawFingerprint() {
      var d = S.fp || {}, f = d.fingerprint || {}, names = {};
      (d.all_categories || []).concat(d.categories || []).forEach(function (c) { names[c.slug] = c.name; });
      var src = f.sources || {}, acc = d.accounts || {}, th = acc.threads || {};
      var place = placeText();
      var threads;
      if (th.state === "ready") threads = lookRow("threads", "Threads", "Public posts that ask the room", sw("threads", src.threads === true, "Threads"));
      else if (th.state === "waiting_approval") threads = lookRow("threads", "Threads", "Waiting for Meta's approval");
      else if (th.state === "not_connected" || th.state === "needs_reconnect") threads = lookRow("threads", "Threads", th.state === "needs_reconnect" ? "Reconnect Threads to look there" : "Connect Threads to look there", link(th.state === "needs_reconnect" ? "Reconnect" : "Connect", "/integrations.html#threads"));
      else threads = lookRow("threads", "Threads", "Not available yet");
      $("lrFpBody").innerHTML =
        '<p class="lr-lbl">What you do</p>' +
        '<div class="lr-wrap" data-field="categories">' + (f.categories || []).map(function (s) { return chip(s, names[s] || s, true, ' aria-label="Remove ' + esc(names[s] || s) + '"'); }).join("") + adder("categories", "Add what you do") + '</div>' + editor("categories") +
        '<p class="lr-lbl">Where</p>' +
        '<div class="lr-wrap" data-field="reach">' + (place ? chip("place", place, true, ' data-add="place" aria-label="Change your city, ' + esc(place) + '"') : chip("", "+ Add your city", false, ' data-add="place"')) +
          REACH.map(function (r) { return chip(r[0], r[1], f.reach === r[0]); }).join("") + '</div>' + editor("place", "Your city, for example San Diego, CA") +
        '<p class="lr-lbl">Words people use</p>' +
        '<div class="lr-wrap" data-field="keywords">' + (f.keywords || []).map(function (k) { return S.swapping ? chip(k, k, true, ' data-replace="1" aria-label="Replace ' + esc(k) + ' with ' + esc(S.swapping) + '"') : chip(k, k, true, ' aria-label="Remove ' + esc(k) + '"'); }).join("") + (S.swapping ? "" : adder("keywords", "Add words people use")) + '</div>' + editor("keywords", "Words someone would write, like cover up") +
        spareRow(d, f) +
        '<p class="lr-lbl">Not for me</p>' +
        '<div class="lr-wrap" data-field="not_for_me">' + (f.not_for_me || []).map(function (k) { return chip(k, k, false, ' aria-label="Remove ' + esc(k) + '"'); }).join("") + adder("not_for_me", "Add words that are not for you") + '</div>' + editor("not_for_me", "Words that mean it is not for you") +
        '<p class="lr-lbl">Where to look</p>' +
        '<div>' +
          lookRow("bizforce", "Inside BizForce", "Needs posted by people near you", sw("bizforce", src.bizforce !== false, "Inside BizForce")) +
          lookRow("bluesky", "Bluesky", "Public posts that ask the room", sw("bluesky", src.bluesky !== false, "Bluesky")) +
          lookRow("youtube", "YouTube", "Comments asking for help, limited each day", sw("youtube", src.youtube !== false, "YouTube")) +
          threads +
        '</div>';
      var input = $("lrFpBody").querySelector(".lr-in"); if (input) input.focus();
    }
    function save(body) {
      fpMsg("");
      return call("PUT", "/api/leads/fingerprint", body).then(function (res) {
        if (refused(res)) return;
        if (!res.ok) { fpMsg((res.data && res.data.error) || "That change could not be saved just now. Try again."); drawFingerprint(); return; }
        S.fp = res.data; S.editing = null; drawFingerprint();
        if (S.loaded) loadLeads();
      });
    }
    function list(field) { var f = (S.fp && S.fp.fingerprint) || {}; return (f[field] || []).slice(); }
    $("lrFpBody").addEventListener("click", function (e) {
      var s = e.target.closest(".lr-sw[data-src]");
      if (s) {
        var src = Object.assign({}, (S.fp.fingerprint && S.fp.fingerprint.sources) || {});
        src[s.getAttribute("data-src")] = s.getAttribute("aria-checked") !== "true";
        s.setAttribute("aria-checked", src[s.getAttribute("data-src")] ? "true" : "false");
        save({ sources: src }); return;
      }
      var c = e.target.closest(".lr-chip"); if (!c) return;
      if (c.hasAttribute("data-spare-cancel")) { S.swapping = null; drawFingerprint(); return; }
      if (c.hasAttribute("data-spare-v")) {
        var sw0 = c.getAttribute("data-v");
        if (S.swapping === sw0) { S.swapping = null; drawFingerprint(); return; }
        if (list("keywords").length >= MAX_WORDS) { S.swapping = sw0; drawFingerprint(); return; }
        swapSpare(sw0, null); return;
      }
      if (c.hasAttribute("data-replace")) { if (S.swapping) swapSpare(S.swapping, c.getAttribute("data-v")); return; }
      var add = c.getAttribute("data-add");
      if (add) { S.editing = S.editing === add ? null : add; drawFingerprint(); return; }
      var v = c.getAttribute("data-v");
      if (c.hasAttribute("data-pick-v")) { var cats = list("categories"); cats.push(v); save({ categories: cats }); return; }
      var field = c.parentNode && c.parentNode.getAttribute("data-field");
      if (field === "reach") { if (v && v !== "place") save({ reach: v }); return; }
      if (field) { var body = {}; body[field] = list(field).filter(function (x) { return x !== v; }); save(body); }
    });
    $("lrFpBody").addEventListener("submit", function (e) {
      var form = e.target.closest("form[data-form]"); if (!form) return;
      e.preventDefault();
      var field = form.getAttribute("data-form"), v = String(form.elements.v.value || "").trim();
      if (field === "place") { var parts = v.split(","); save({ place_city: (parts[0] || "").trim() || null, place_region: parts.slice(1).join(",").trim() || null }); return; }
      if (!v) return;
      var cur = list(field);
      if (cur.indexOf(v) === -1) cur.push(v);
      var body = {}; body[field] = cur; save(body);
    });

    /* ── start: signed out (no request), a free account (the members panel, no request), a member (the leads) ── */
    function whenAccess(cb) {
      var done = false; function once(a) { if (!done) { done = true; cb(a || {}); } }
      if (window.bfAccess && window.bfAccess.ready) { window.bfAccess.ready.then(once); return; }
      document.addEventListener("bf-access", function (e) { once(e.detail); });
      setTimeout(function () { if (window.bfAccess && window.bfAccess.ready) window.bfAccess.ready.then(once); else once({}); }, 6000);
    }
    function start() {
      if (!tok()) { showState("signed_out"); return; }
      whenAccess(function (a) {
        if (a.tier === "free") { showState("members_only"); return; }
        loadLeads();
      });
    }
    start();
  })();
  </script>
<script src="/scripts/termaximus-presence.js"></script>
<script src="/scripts/termaximus-guide.js"></script>
<footer class="bf-legal-footer" data-bf-legal-footer></footer>
<script src="/scripts/bf-legal-footer.js"></script>
