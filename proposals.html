<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BizForce AI — Agent Proposals</title>
  <script>(function(){var t=localStorage.getItem("bf_token");if(!t)window.location.replace("app.html");})();</script>
  <link rel="stylesheet" href="/css/bizforce-ui.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e6edf3;background:#070b18}
    body{min-height:100vh;position:relative;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(0,229,255,.14),transparent 38%),radial-gradient(circle at 85% 90%,rgba(168,85,247,.18),transparent 40%),#070b18;z-index:0;pointer-events:none}
    .page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 24px 40px}
    .top-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
    .back-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid rgba(0,229,255,.25);background:rgba(12,18,38,.6);color:#22d3ee;text-decoration:none;font-size:.875rem;font-weight:600;transition:all .25s;backdrop-filter:blur(12px)}
    .back-link:hover{border-color:rgba(0,229,255,.55);box-shadow:0 0 20px rgba(0,229,255,.18)}
    .back-link svg{width:16px;height:16px;flex-shrink:0}
    .brand-badge{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero{text-align:center;margin-bottom:28px}
    .hero-eyebrow{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.08);color:#22d3ee;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
    .hero-title{margin:0 0 8px;font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#00e5ff 0%,#7b2ff7 60%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero-sub{margin:0;color:#8892b8;font-size:.95rem;line-height:1.6}
    .generate-bar{display:flex;justify-content:flex-end;margin-bottom:10px}
    .btn-generate{padding:10px 22px;border:none;border-radius:12px;font-size:.82rem;font-weight:700;letter-spacing:.03em;font-family:inherit;color:#fff;background:linear-gradient(135deg,#00e5ff,#7b2ff7);cursor:pointer;transition:all .2s}
    .btn-generate:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,229,255,.3)}
    .btn-generate:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-generate + .btn-generate{margin-left:10px}
    .generate-status{min-height:0;text-align:right;font-size:.78rem;line-height:1.5;color:#8892b8}
    .generate-status.success{color:#34d399}
    .generate-status.show{min-height:16px;margin-bottom:14px}
    .generate-status.error{color:#f87171}
    .filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
    .filter-pill{padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(12,18,38,.6);color:#8892b8;font-size:.78rem;font-weight:700;letter-spacing:.04em;font-family:inherit;cursor:pointer;transition:all .2s}
    .filter-pill:hover{border-color:rgba(34,211,238,.35);color:#e6edf3}
    .filter-pill.active{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1);color:#22d3ee;box-shadow:0 0 16px rgba(0,229,255,.14)}
    .proposals-list{display:flex;flex-direction:column;gap:14px}
    .proposal-card{background:rgba(10,15,35,.82);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px 22px}
    .proposal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
    .proposal-title{font-size:1rem;font-weight:800;color:#f4f7ff;line-height:1.4;min-width:0}
    .proposal-labels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .proposal-label{padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8892b8;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .proposal-reasoning{margin:0 0 14px;color:#e6edf3;font-size:.88rem;line-height:1.6;word-break:break-word}
    .proposal-meta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
    .proposal-cost{font-size:.82rem;font-weight:700;color:#f4f7ff}
    .proposal-date{font-size:.72rem;color:#4a5280;margin-left:auto}
    .status-badge{flex-shrink:0;padding:5px 12px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .badge-pending{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.32);color:#fbbf24}
    .badge-approved{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.32);color:#22d3ee}
    .badge-rejected{background:rgba(136,146,184,.1);border:1px solid rgba(136,146,184,.28);color:#8892b8}
    .badge-executing{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.32);color:#fbbf24}
    .badge-executed{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.32);color:#34d399}
    .badge-failed{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.32);color:#f87171}
    .exec-block{margin:0 0 12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8892b8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
    .exec-block.exec-error{border-color:rgba(248,113,113,.28);background:rgba(248,113,113,.08);color:#f87171}
    .payload-fields{margin:0 0 12px;font-size:.78rem;line-height:1.8;color:#8892b8}
    .payload-fields>div{margin-bottom:4px}
    .pf-label{display:inline-block;min-width:150px;color:#4a5280;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;font-weight:700}
    .pf-value{color:#e6edf3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;word-break:break-word}
    .pf-count{color:#4a5280;font-size:.72rem}
    .payload-fields ul{margin:4px 0 0 150px;padding-left:18px}
    .payload-fields li{color:#e6edf3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;word-break:break-word;margin-bottom:2px}
    .payload-toggle{margin:0 0 12px}
    .payload-toggle summary{cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 0;color:#22d3ee;font-size:.78rem;font-weight:700;letter-spacing:.03em;list-style:none;user-select:none}
    .payload-toggle summary::-webkit-details-marker{display:none}
    .payload-toggle summary::before{content:"\25B8";display:inline-block;transition:transform .2s}
    .payload-toggle[open] summary::before{transform:rotate(90deg)}
    .payload-toggle summary:hover{color:#67e8f9}
    .proposal-actions{display:flex;gap:10px;margin-top:14px}
    .proposal-actions button{padding:10px 22px;border-radius:12px;font-size:.82rem;font-weight:700;letter-spacing:.03em;font-family:inherit;cursor:pointer;transition:all .2s}
    .proposal-actions button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-approve{border:none;color:#fff;background:linear-gradient(135deg,#00e5ff,#7b2ff7)}
    .btn-approve:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,229,255,.3)}
    .btn-reject{border:1px solid rgba(255,255,255,.14);background:transparent;color:#8892b8}
    .btn-reject:hover:not(:disabled){border-color:rgba(248,113,113,.4);color:#f87171}
    .card-message{min-height:0;font-size:.78rem;line-height:1.5}
    .card-message.show{min-height:16px;margin-top:10px;color:#f87171}
    .empty-state{text-align:center;padding:40px 20px;color:#8892b8;font-size:.88rem;line-height:1.6;margin:auto}
    .empty-state.error{color:#f87171}
  </style>
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <a href="dashboard.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Executive HQ
    </a>
    <span class="brand-badge">BizForce AI</span>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow">APPROVAL GATE</div>
    <h1 class="hero-title">Agent Proposals</h1>
    <p class="hero-sub">Your agents propose actions here and nothing executes until you approve it.</p>
  </div>

  <div class="generate-bar">
    <button type="button" id="generateBtn" class="btn-generate">Generate</button>
    <button type="button" id="generatePostBtn" class="btn-generate">Generate Blog Post</button>
  </div>
  <div id="generateStatus" class="generate-status"></div>

  <div class="filter-bar">
    <button type="button" class="filter-pill active" data-status="">All</button>
    <button type="button" class="filter-pill" data-status="pending">Pending</button>
    <button type="button" class="filter-pill" data-status="approved">Approved</button>
    <button type="button" class="filter-pill" data-status="rejected">Rejected</button>
    <button type="button" class="filter-pill" data-status="executing">Executing</button>
    <button type="button" class="filter-pill" data-status="executed">Executed</button>
    <button type="button" class="filter-pill" data-status="failed">Failed</button>
  </div>

  <div id="proposalsList" class="proposals-list"></div>
</div>

<script>
var API_URL = "https://dynamic-prosperity-production-5382.up.railway.app";
var token = localStorage.getItem("bf_token");

var STATUS_BADGES = ["pending","approved","rejected","executing","executed","failed"];

var currentFilter = "";
var proposals = [];
var loadError = null;
// Per-card messages, keyed by proposal id. renderProposals() rewrites the whole
// list, so a message written straight to the DOM would be destroyed by the
// reload that follows it — it has to be re-applied after each render.
var cardMessages = {};

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatTime(iso) {
  try {
    return new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  } catch (e) {
    return "";
  }
}

function formatResult(value) {
  if (typeof value === "string") return value;
  try {
    return JSON.stringify(value, null, 2);
  } catch (e) {
    return String(value);
  }
}

// One local date part out of a proposal payload, or null when it is not a
// whole number. Used to decide whether a create_calendar_event payload can be
// rendered as a date at all.
//
// Deliberately NOT Number(): Number(null), Number(undefined's absence via a
// missing key, ""), Number([]) and Number(false) are 0 and Number(true) is 1,
// so a bare coercion would turn a missing part into a real-looking 0 and print
// a date nobody proposed. Returning null keeps "absent" distinguishable from a
// value, which is what lets the caller fall back to the raw JSON instead of
// rendering a partial or wrong date.
function datePartOrNull(value) {
  if (typeof value === "number" && Number.isInteger(value)) {
    return value;
  }

  if (typeof value === "string" && /^-?\d+$/.test(value.trim())) {
    return parseInt(value.trim(), 10);
  }

  return null;
}

// Two digits, for building a date string out of integers without a Date. This
// page does no calendar arithmetic of any kind — see the create_calendar_event
// arm below for why.
function pad2(n) {
  return (n < 10 && n >= 0 ? "0" : "") + n;
}

async function loadProposals() {
  var container = document.getElementById("proposalsList");
  container.innerHTML = '<div class="empty-state">Loading proposals...</div>';

  loadError = null;
  try {
    var url = API_URL + "/api/proposals";
    if (currentFilter) {
      url += "?status=" + encodeURIComponent(currentFilter);
    }
    var res = await fetch(url, {
      headers: { "Authorization": "Bearer " + token }
    });
    if (!res.ok) throw new Error("Could not load proposals");
    var d = await res.json();
    proposals = d.proposals || [];
  } catch (e) {
    proposals = [];
    loadError = e.message || "Could not load proposals";
  }
  renderProposals();
}

function renderProposals() {
  var container = document.getElementById("proposalsList");

  if (loadError) {
    container.innerHTML = '<div class="empty-state error">' + escapeHtml(loadError) + '</div>';
    return;
  }

  if (!proposals.length) {
    container.innerHTML = '<div class="empty-state">No proposals matching this filter.</div>';
    return;
  }

  container.innerHTML = proposals.map(function (p) {
    // Only a known status becomes a badge class, so the value from the API can
    // never inject a class name of its own.
    var badgeKey = STATUS_BADGES.indexOf(p.status) !== -1 ? p.status : "rejected";

    var reasoning = p.reasoning
      ? '<p class="proposal-reasoning">' + escapeHtml(p.reasoning) + '</p>'
      : '';

    var cost = Number(p.cost_amount);
    var costHtml = (isFinite(cost) && cost > 0)
      ? '<span class="proposal-cost">' + escapeHtml(cost.toFixed(2)) + ' ' + escapeHtml(p.cost_currency || "USD") + '</span>'
      : '';

    // An execution_error supersedes the result: a failed run has nothing
    // meaningful in execution_result, and the error is what needs reading.
    var execHtml = '';
    if (p.execution_error) {
      execHtml = '<pre class="exec-block exec-error">' + escapeHtml(p.execution_error) + '</pre>';
    } else if (p.execution_result !== null && p.execution_result !== undefined) {
      execHtml = '<pre class="exec-block">' + escapeHtml(formatResult(p.execution_result)) + '</pre>';
    }

    // Payload rendering — a reviewer has to see what they are approving.
    // SECURITY: payload.body is model-written HTML. It is ALWAYS escaped and
    // shown as literal source inside a <pre>, exactly as execution_result is
    // handled above. It is never assigned via innerHTML anywhere.
    var payloadHtml = '';
    if (p.payload && typeof p.payload === "object") {
      var fieldsHtml = '';
      var collapsibleText;

      if (p.action_type === "publish_blog_post") {
        var slug = String(p.payload.slug == null ? "" : p.payload.slug);
        var meta = String(p.payload.meta_description == null ? "" : p.payload.meta_description);
        var postBody = String(p.payload.body == null ? "" : p.payload.body);
        var links = Array.isArray(p.payload.internal_links) ? p.payload.internal_links : [];

        // Literal count of the anchor-open string, so the reviewer can see how
        // many links the post actually carries.
        var anchorCount = postBody.split("<a href=").length - 1;

        var linksHtml = links.length
          ? '<ul>' + links.map(function (l) { return '<li>' + escapeHtml(l) + '</li>'; }).join('') + '</ul>'
          : '<span class="pf-value">none</span>';

        fieldsHtml =
          '<div class="payload-fields">' +
            '<div><span class="pf-label">slug</span><span class="pf-value">' + escapeHtml(slug || "(none)") + '</span></div>' +
            '<div><span class="pf-label">meta description</span><span class="pf-value">' + escapeHtml(meta || "(none)") + '</span> <span class="pf-count">(' + meta.length + ' chars)</span></div>' +
            '<div><span class="pf-label">anchor tags in body</span><span class="pf-value">' + anchorCount + '</span></div>' +
            '<div><span class="pf-label">internal links</span>' + linksHtml + '</div>' +
          '</div>';

        collapsibleText = postBody;
      } else if (p.action_type === "create_calendar_event") {
        // The reviewer is approving a DAY, so the card has to show one. The
        // date is built from the payload's local_year/local_month/local_day —
        // the caller's own local date parts, recorded by the backend for
        // exactly this purpose — and NOT by converting the jdn. No
        // JDN-to-Gregorian function is added to this page on purpose: a second
        // implementation of that conversion is a second thing that can
        // disagree with calendar.html, and the parts are already here.
        var calYear  = datePartOrNull(p.payload.local_year);
        var calMonth = datePartOrNull(p.payload.local_month);
        var calDay   = datePartOrNull(p.payload.local_day);

        collapsibleText = formatResult(p.payload);

        // All three or none. A payload missing any one of them cannot produce
        // a date that means anything, and half a date on an approval card is
        // worse than no field table at all — the approver would read whatever
        // survived as the day they are agreeing to. Leaving fieldsHtml empty
        // falls this card back to the plain collapsed JSON that every
        // unrecognised action_type already gets.
        if (calYear !== null && calMonth !== null && calDay !== null) {
          var evTitle = String(p.payload.title == null ? "" : p.payload.title);
          var evType  = String(p.payload.event_type == null ? "" : p.payload.event_type);
          var evNote  = String(p.payload.notes == null ? "" : p.payload.notes);
          var evJdn   = String(p.payload.jdn == null ? "" : p.payload.jdn);

          var localDateText = calYear + "-" + pad2(calMonth) + "-" + pad2(calDay);

          var noteHtml = evNote
            ? '<div><span class="pf-label">note</span><span class="pf-value">' + escapeHtml(evNote) + '</span></div>'
            : '';

          // Offset shown only when it actually moves the day. Its absence and
          // a zero both mean the event lands on the local date above, and a
          // row reading "0 days" invites the reader to wonder what it moved.
          var offset = datePartOrNull(p.payload.days_from_now);
          var offsetHtml = '';

          if (offset !== null && offset !== 0) {
            var offsetText = (offset > 0 ? "+" : "") + offset +
              (offset === 1 || offset === -1 ? " day" : " days");

            offsetHtml =
              '<div><span class="pf-label">days from now</span><span class="pf-value">' + escapeHtml(offsetText) + '</span> ' +
              '<span class="pf-count">(the event is this far from the local date above, not on it)</span></div>';
          }

          // The local date is labelled as the date the request came FROM, never
          // as the event day, because those are only the same thing when the
          // offset above is absent. This page cannot compute the shifted day —
          // that would need month-length and leap-year arithmetic it
          // deliberately does not carry — so it names what it actually knows
          // and shows the offset beside it.
          var anchorNoteHtml = offsetHtml
            ? ''
            : ' <span class="pf-count">(the event day)</span>';

          fieldsHtml =
            '<div class="payload-fields">' +
              '<div><span class="pf-label">event title</span><span class="pf-value">' + escapeHtml(evTitle || "(none)") + '</span></div>' +
              '<div><span class="pf-label">event type</span><span class="pf-value">' + escapeHtml(evType || "(none)") + '</span></div>' +
              noteHtml +
              '<div><span class="pf-label">caller\'s local date</span><span class="pf-value">' + escapeHtml(localDateText) + '</span>' + anchorNoteHtml + '</div>' +
              offsetHtml +
              '<div><span class="pf-label">jdn</span><span class="pf-value">' + escapeHtml(evJdn || "(none)") + '</span> <span class="pf-count">(reference — the day number that gets written)</span></div>' +
            '</div>';
        }
      } else {
        collapsibleText = formatResult(p.payload);
      }

      payloadHtml =
        fieldsHtml +
        '<details class="payload-toggle">' +
          '<summary>View payload</summary>' +
          '<pre class="exec-block">' + escapeHtml(collapsibleText) + '</pre>' +
        '</details>';
    }

    // Only a pending proposal can be decided; every other status is terminal or
    // already in flight, so those cards carry no buttons at all.
    var actions = p.status === "pending"
      ? '<div class="proposal-actions">' +
          '<button type="button" class="btn-approve" onclick="decideProposal(this,\'approve\')">Approve</button>' +
          '<button type="button" class="btn-reject" onclick="decideProposal(this,\'reject\')">Reject</button>' +
        '</div>'
      : '';

    return '<div class="proposal-card" data-id="' + escapeHtml(p.id) + '">' +
      '<div class="proposal-head">' +
        '<div class="proposal-title">' + escapeHtml(p.title) + '</div>' +
        '<span class="status-badge badge-' + badgeKey + '">' + escapeHtml(p.status) + '</span>' +
      '</div>' +
      execHtml +
      '<div class="proposal-labels">' +
        '<span class="proposal-label">' + escapeHtml(p.agent_type) + '</span>' +
        '<span class="proposal-label">' + escapeHtml(p.action_type) + '</span>' +
      '</div>' +
      reasoning +
      payloadHtml +
      '<div class="proposal-meta">' +
        costHtml +
        '<span class="proposal-date">' + escapeHtml(formatTime(p.created_at)) + '</span>' +
      '</div>' +
      actions +
      '<div class="card-message"></div>' +
    '</div>';
  }).join("");

  Array.prototype.forEach.call(container.querySelectorAll(".proposal-card"), function (card) {
    var text = cardMessages[card.getAttribute("data-id")];
    if (!text) return;
    var el = card.querySelector(".card-message");
    el.textContent = text;
    el.className = "card-message show";
  });
}

async function decideProposal(btn, action) {
  var card = btn.closest(".proposal-card");
  if (!card) return;

  var id = card.getAttribute("data-id");
  var buttons = card.querySelectorAll(".proposal-actions button");
  var message = card.querySelector(".card-message");

  // Disable both buttons before the request goes out, so a second click during
  // the round trip cannot fire the action twice.
  Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });
  btn.textContent = action === "approve" ? "Approving..." : "Rejecting...";
  delete cardMessages[id];
  message.textContent = "";
  message.className = "card-message";

  try {
    var res = await fetch(API_URL + "/api/proposals/" + encodeURIComponent(id) + "/" + action, {
      method: "POST",
      headers: { "Authorization": "Bearer " + token }
    });

    if (res.status === 409) {
      cardMessages[id] = "This proposal is no longer pending.";
      message.textContent = cardMessages[id];
      message.className = "card-message show";
      await loadProposals();
      return;
    }

    if (!res.ok) {
      var e = await res.json().catch(function () { return {}; });
      throw new Error(e.error || "Could not " + action + " this proposal");
    }

    await loadProposals();
  } catch (e) {
    // The card is rebuilt from server state, which restores the buttons on its
    // own — but it also discards this node, so the message is stashed by id and
    // re-applied by renderProposals() after the reload.
    cardMessages[id] = e.message || "Could not " + action + " this proposal";
    message.textContent = cardMessages[id];
    message.className = "card-message show";
    await loadProposals();
  }
}

async function generateProposals() {
  var btn = document.getElementById("generateBtn");
  var status = document.getElementById("generateStatus");
  var label = btn.textContent;

  // This call runs a model server-side and can take 20s or more, so the
  // button has to read as busy for the whole round trip.
  btn.disabled = true;
  btn.textContent = "Thinking...";
  status.textContent = "";
  status.className = "generate-status";

  try {
    var res = await fetch(API_URL + "/api/agents/store/generate-proposals", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token }
    });

    var d = await res.json().catch(function () { return {}; });

    if (!res.ok) {
      throw new Error(d.error || "Could not generate proposals");
    }

    if (res.status === 201) {
      currentFilter = "pending";
      Array.prototype.forEach.call(document.querySelectorAll(".filter-pill"), function (pill) {
        pill.className = pill.getAttribute("data-status") === "pending"
          ? "filter-pill active"
          : "filter-pill";
      });
      await loadProposals();
      return;
    }

    // 200 — the agent ran but had nothing worth proposing.
    status.textContent = d.message || "The Store Agent found no new listings worth proposing.";
    status.className = "generate-status show";
  } catch (e) {
    status.textContent = e.message || "Could not generate proposals";
    status.className = "generate-status show error";
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

async function generateBlogPost() {
  var btn = document.getElementById("generatePostBtn");
  var status = document.getElementById("generateStatus");
  var label = btn.textContent;

  // The SEO writer runs Sonnet over a long-form article server-side. It
  // normally takes 30-90s and can take longer, so the button carries the wait
  // time and the request is given a full 300s before it is abandoned.
  btn.disabled = true;
  btn.textContent = "Writing... up to 2 min";
  status.textContent = "";
  status.className = "generate-status";

  var controller = new AbortController();
  var abortTimer = setTimeout(function () { controller.abort(); }, 300000);

  try {
    var res = await fetch(API_URL + "/api/agents/seo/generate-post", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({}),
      signal: controller.signal
    });

    var d = await res.json().catch(function () { return {}; });

    if (!res.ok) {
      throw new Error(d.error || "Could not generate a blog post");
    }

    var postTitle = (d.proposal && d.proposal.payload && d.proposal.payload.title) || "";

    // Reload first, then write the message. #generateStatus lives outside
    // #proposalsList so the re-render cannot destroy it — the same reason
    // cardMessages exists for messages that sit inside the list.
    await loadProposals();

    status.textContent = postTitle
      ? 'Draft ready: "' + postTitle + '" — review it in the queue below.'
      : "Draft ready — review it in the queue below.";
    status.className = "generate-status show success";
  } catch (e) {
    status.textContent = (e && e.name === "AbortError")
      ? "The SEO Agent did not respond within 5 minutes. Nothing was created."
      : (e.message || "Could not generate a blog post");
    status.className = "generate-status show error";
  } finally {
    clearTimeout(abortTimer);
    btn.disabled = false;
    btn.textContent = label;
  }
}

document.getElementById("generateBtn").addEventListener("click", generateProposals);
document.getElementById("generatePostBtn").addEventListener("click", generateBlogPost);

Array.prototype.forEach.call(document.querySelectorAll(".filter-pill"), function (btn) {
  btn.addEventListener("click", function () {
    currentFilter = btn.getAttribute("data-status") || "";
    Array.prototype.forEach.call(document.querySelectorAll(".filter-pill"), function (other) {
      other.className = other === btn ? "filter-pill active" : "filter-pill";
    });
    loadProposals();
  });
});

loadProposals();
</script>
</body>
</html>
