<!DOCTYPE html>
<html lang="en">
<head>
<script src="/scripts/bf-theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BizForce AI — Shopify Data Requests</title>
  <link rel="stylesheet" href="/css/bizforce-ui.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e6edf3;background:#070b18}
    body{min-height:100vh;position:relative;overflow-x:hidden}
    /* The backdrop is the token rule in scripts/bf-theme.js. */
    .page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 24px 40px}
    .top-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
    .back-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid rgba(var(--bf-accent-a3-rgb, 0,229,255),.25);background:rgba(12,18,38,.6);color:var(--bf-accent-a, #22d3ee);text-decoration:none;font-size:.875rem;font-weight:600;transition:all .25s;backdrop-filter:blur(12px)}
    .back-link:hover{border-color:rgba(var(--bf-accent-a3-rgb, 0,229,255),.55);box-shadow:0 0 20px rgba(var(--bf-accent-a3-rgb, 0,229,255),.18)}
    .back-link svg{width:16px;height:16px;flex-shrink:0}
    .brand-badge{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,var(--bf-mark-a, #22d3ee)var(--bf-mark-mid, ),var(--bf-mark-b, #a855f7));-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero{text-align:center;margin-bottom:28px}
    .hero-eyebrow{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid rgba(var(--bf-accent-a-rgb, 34,211,238),.3);background:rgba(var(--bf-accent-a-rgb, 34,211,238),.08);color:var(--bf-accent-a, #22d3ee);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
    .hero-title{margin:0 0 8px;font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--bf-accent-a3, #00e5ff) 0%,var(--bf-accent-b3, #7b2ff7) 60%,var(--bf-accent-b, #a855f7) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero-sub{margin:0;color:#8892b8;font-size:.95rem;line-height:1.6}
    .section-title{margin:26px 0 12px;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8892b8}
    .requests-list{display:flex;flex-direction:column;gap:14px}
    .request-card{background:rgba(10,15,35,.82);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px 22px}
    .request-card.answered{opacity:.78}
    .request-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap}
    .request-shop{font-size:1rem;font-weight:800;color:#f4f7ff;line-height:1.4;min-width:0;word-break:break-word}
    .status-badge{flex-shrink:0;padding:5px 12px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .badge-open{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.32);color:#fbbf24}
    .badge-overdue{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.32);color:#f87171}
    .badge-answered{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.32);color:#34d399}
    .request-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:0}
    .request-facts div{min-width:0}
    .request-facts dt{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#4a5280;margin-bottom:3px}
    .request-facts dd{margin:0;font-size:.86rem;line-height:1.5;color:#e6edf3;word-break:break-word}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .request-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
    .btn{padding:9px 18px;border:none;border-radius:12px;font-size:.8rem;font-weight:700;letter-spacing:.03em;font-family:inherit;cursor:pointer;transition:all .2s}
    .btn-primary{color:var(--bf-btn-text, #fff);background:linear-gradient(135deg,var(--bf-btn-a, #00e5ff)var(--bf-btn-mid, ),var(--bf-btn-b, #7b2ff7))}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(var(--bf-accent-a3-rgb, 0,229,255),.3)}
    .btn-quiet{color:#cfd3ea;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .confirm-text{font-size:.82rem;line-height:1.5;color:#fbbf24;flex-basis:100%}
    .action-error{font-size:.8rem;color:#f87171;flex-basis:100%}
    .empty-state{text-align:center;padding:40px 20px;color:#8892b8;font-size:.88rem;line-height:1.6;margin:auto}
    .empty-state.error{color:#f87171}
  </style>
<link rel="stylesheet" href="/css/bf-phone.css"><!-- NAMED (Nov 19 2026, PH1): the phone layout; every rule is inside @media (max-width: 760px), so the desktop is unchanged. -->
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <a href="dashboard.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Executive HQ
    </a>
    <span class="brand-badge">BizForce AI</span>
  </nav>

  <!-- Owner only. A visitor who is not signed in, or whose account is not the
       admin, sees the one line in #ownerOnly and nothing else: the server
       answers GET /api/admin/shopify-data-requests with 401 or 403 for them,
       and this page draws no list, no headings and no buttons in that case.
       Shopify asks for each data request to be answered within 30 days of
       arrival; "Mark answered" records that it was, which stops the 23-day
       reminder email and starts the record's 30 days to deletion. -->
  <p class="empty-state" id="ownerOnly" hidden>This page is for the site owner.</p>

  <div id="ownerView" hidden>
    <header class="hero">
      <span class="hero-eyebrow">Shopify</span>
      <h1 class="hero-title">Data Requests</h1>
      <p class="hero-sub">Requests from connected stores' customers for their data. Each must be answered within 30 days of arrival.</p>
    </header>
    <div id="requestsArea"><p class="empty-state">Loading requests...</p></div>
  </div>
</div>

<script>
var API_URL = "https://dynamic-prosperity-production-5382.up.railway.app";
var token = localStorage.getItem("bf_token");

var DAY_MS = 24 * 60 * 60 * 1000;
var RECENT_ANSWERED_MS = 30 * DAY_MS;
var requests = [];
var confirming = {};
var busy = {};
var rowErrors = {};

function showOwnerOnly() {
  document.getElementById("ownerView").hidden = true;
  document.getElementById("ownerOnly").hidden = false;
}

function showOwnerView() {
  document.getElementById("ownerOnly").hidden = true;
  document.getElementById("ownerView").hidden = false;
}

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function dateText(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return esc(iso);
  return esc(d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }));
}

/* Whole days from now to the deadline, rounded up: 0 means it falls today. */
function daysLeftText(deadlineIso) {
  var t = new Date(deadlineIso).getTime();
  if (isNaN(t)) return "";
  var days = Math.ceil((t - Date.now()) / DAY_MS);
  if (days < 0) return "overdue by " + (-days) + (days === -1 ? " day" : " days");
  if (days === 0) return "due today";
  return days + (days === 1 ? " day left" : " days left");
}

function isOverdue(r) {
  var t = new Date(r.deadline).getTime();
  return !isNaN(t) && t < Date.now();
}

function details(r) {
  return r && r.request_details && typeof r.request_details === "object" ? r.request_details : {};
}

function fact(label, valueHtml, mono) {
  return '<div><dt>' + esc(label) + '</dt><dd' + (mono ? ' class="mono"' : '') + '>' + valueHtml + '</dd></div>';
}

function cardHtml(r) {
  var d = details(r);
  var orders = Array.isArray(d.orders_requested) && d.orders_requested.length ? d.orders_requested.map(esc).join(", ") : "None named";
  var badge = r.open
    ? (isOverdue(r) ? '<span class="status-badge badge-overdue">Overdue</span>' : '<span class="status-badge badge-open">Open</span>')
    : '<span class="status-badge badge-answered">Answered</span>';
  var html = '<article class="request-card' + (r.open ? '' : ' answered') + '" data-request-id="' + esc(r.id) + '">'
    + '<div class="request-head"><div class="request-shop">' + esc(r.shop) + '</div>' + badge + '</div>'
    + '<dl class="request-facts">'
    + fact("Received", dateText(r.received_at))
    + fact("Deadline", dateText(r.deadline) + (r.open ? " (" + esc(daysLeftText(r.deadline)) + ")" : ""))
    + fact("Request id", d.data_request_id ? esc(d.data_request_id) : "Not readable", true)
    + fact("Order ids", orders, true)
    + fact("Owner email", r.owner_notified_at ? "Sent " + dateText(r.owner_notified_at) : "Not sent")
    + (r.open ? "" : fact("Answered", dateText(r.answered_at)))
    + '</dl>';
  if (r.open) {
    html += '<div class="request-actions">';
    if (confirming[r.id]) {
      html += '<span class="confirm-text">Mark this request answered? Do this only after the customer\'s data has been sent to the store. It stops the reminder email.</span>'
        + '<button class="btn btn-primary" data-action="confirm" data-id="' + esc(r.id) + '"' + (busy[r.id] ? ' disabled' : '') + '>' + (busy[r.id] ? "Saving..." : "Yes, mark answered") + '</button>'
        + '<button class="btn btn-quiet" data-action="cancel" data-id="' + esc(r.id) + '"' + (busy[r.id] ? ' disabled' : '') + '>Cancel</button>';
    } else {
      html += '<button class="btn btn-primary" data-action="ask" data-id="' + esc(r.id) + '">Mark answered</button>';
    }
    if (rowErrors[r.id]) html += '<span class="action-error">' + esc(rowErrors[r.id]) + '</span>';
    html += '</div>';
  }
  return html + '</article>';
}

function render() {
  var area = document.getElementById("requestsArea");
  var now = Date.now();
  var open = requests.filter(function (r) { return r.open; });
  var answered = requests.filter(function (r) {
    if (r.open) return false;
    var t = new Date(r.answered_at).getTime();
    return !isNaN(t) && now - t <= RECENT_ANSWERED_MS;
  });
  // Open: the nearest deadline first. Answered: the latest answer first.
  open.sort(function (a, b) { return String(a.deadline).localeCompare(String(b.deadline)); });
  answered.sort(function (a, b) { return String(b.answered_at).localeCompare(String(a.answered_at)); });
  if (!open.length && !answered.length) {
    area.innerHTML = '<p class="empty-state" id="emptyState">No Shopify data requests.</p>';
    return;
  }
  var html = "";
  html += '<h2 class="section-title">Open (' + open.length + ')</h2>';
  html += open.length ? '<div class="requests-list" id="openList">' + open.map(cardHtml).join("") + '</div>'
    : '<p class="empty-state">No open requests.</p>';
  if (answered.length) {
    html += '<h2 class="section-title">Answered in the last 30 days</h2>';
    html += '<div class="requests-list" id="answeredList">' + answered.map(cardHtml).join("") + '</div>';
  }
  area.innerHTML = html;
}

function replaceRequest(updated) {
  for (var i = 0; i < requests.length; i++) {
    if (requests[i].id === updated.id) { requests[i] = updated; return; }
  }
}

function markAnswered(id) {
  busy[id] = true;
  delete rowErrors[id];
  render();
  fetch(API_URL + "/api/admin/shopify-data-requests/" + encodeURIComponent(id) + "/answered", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }
  }).then(function (res) {
    if (res.status === 401 || res.status === 403) { showOwnerOnly(); return null; }
    return res.json().catch(function () { return null; }).then(function (body) {
      if (!res.ok || !body || !body.request) throw new Error((body && body.error) || "The request could not be marked answered just now.");
      return body;
    });
  }).then(function (body) {
    delete busy[id];
    if (!body) return;
    delete confirming[id];
    replaceRequest(body.request);
    render();
  }).catch(function (err) {
    delete busy[id];
    rowErrors[id] = (err && err.message) || "The request could not be marked answered just now.";
    render();
  });
}

document.getElementById("requestsArea").addEventListener("click", function (e) {
  var btn = e.target && e.target.closest ? e.target.closest("button[data-action]") : null;
  if (!btn) return;
  var id = btn.getAttribute("data-id");
  var action = btn.getAttribute("data-action");
  if (action === "ask") { confirming[id] = true; delete rowErrors[id]; render(); }
  else if (action === "cancel") { delete confirming[id]; render(); }
  else if (action === "confirm" && confirming[id] && !busy[id]) { markAnswered(id); }
});

function loadRequests() {
  if (!token) { showOwnerOnly(); return; }
  fetch(API_URL + "/api/admin/shopify-data-requests", {
    headers: { "Authorization": "Bearer " + token }
  }).then(function (res) {
    if (res.status === 401 || res.status === 403) { showOwnerOnly(); return; }
    return res.json().catch(function () { return null; }).then(function (body) {
      showOwnerView();
      if (!res.ok || !body || !Array.isArray(body.requests)) {
        document.getElementById("requestsArea").innerHTML = '<p class="empty-state error">The requests could not be loaded just now. Reload the page to try again.</p>';
        return;
      }
      requests = body.requests;
      render();
    });
  }).catch(function () {
    showOwnerView();
    document.getElementById("requestsArea").innerHTML = '<p class="empty-state error">The requests could not be loaded just now. Reload the page to try again.</p>';
  });
}

loadRequests();
</script>
<footer class="bf-legal-footer" data-bf-legal-footer></footer>
<script src="/scripts/bf-legal-footer.js"></script>
</body>
</html>
