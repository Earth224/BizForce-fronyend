<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content=""/>
  <title>BizForce AI — Export Posts</title>
  <link rel="stylesheet" href="/css/bizforce-ui.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e6edf3;background:#070b18}
    body{min-height:100vh;position:relative;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(0,229,255,.14),transparent 38%),radial-gradient(circle at 85% 90%,rgba(168,85,247,.18),transparent 40%),#070b18;z-index:0;pointer-events:none}
    .page{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 24px 64px}
    .top-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
    .back-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid rgba(0,229,255,.25);background:rgba(12,18,38,.6);color:#22d3ee;text-decoration:none;font-size:.875rem;font-weight:600;transition:all .25s;backdrop-filter:blur(12px)}
    .back-link:hover{border-color:rgba(0,229,255,.55);box-shadow:0 0 20px rgba(0,229,255,.18)}
    .back-link svg{width:16px;height:16px;flex-shrink:0}
    .brand-badge{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
    .post-title{margin:0 0 12px;font-size:clamp(1.9rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.2;background:linear-gradient(135deg,#00e5ff 0%,#7b2ff7 60%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .post-meta{margin:0 0 32px;color:#8892b8;font-size:.85rem;letter-spacing:.02em;line-height:1.7}
    .post-list{display:flex;flex-direction:column;gap:16px}
    .post-card{display:block;padding:22px 24px;border-radius:16px;border:1px solid rgba(0,229,255,.18);background:rgba(12,18,38,.6);color:inherit;transition:all .25s;backdrop-filter:blur(12px)}
    .post-card:hover{border-color:rgba(0,229,255,.5);box-shadow:0 0 24px rgba(0,229,255,.14)}
    .card-title{margin:0 0 8px;font-size:1.2rem;font-weight:700;color:#f4f7ff;line-height:1.35;letter-spacing:-.01em}
    .card-date{margin:0;font-size:.8rem;color:#8892b8;letter-spacing:.02em}
    .card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .action-btn{font-family:inherit;font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid rgba(0,229,255,.25);background:rgba(7,11,24,.7);color:#22d3ee;cursor:pointer;transition:all .25s}
    .action-btn:hover:not(:disabled){border-color:rgba(0,229,255,.55);box-shadow:0 0 16px rgba(0,229,255,.16)}
    .action-btn:disabled{opacity:.5;cursor:default}
    .card-status{margin:10px 0 0;font-size:.8rem;line-height:1.6;color:#8892b8;min-height:1.2em}
    .card-status.ok{color:#34d399}
    .card-status.err{color:#f87171}
    .state{text-align:center;padding:64px 20px;color:#8892b8;font-size:.95rem;line-height:1.7}
    .state.error{color:#f87171}
    @media(max-width:640px){
      .post-card{padding:18px 18px}
      .card-title{font-size:1.1rem}
    }
  </style>
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <a id="backLink" href="/marketplace.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to store
    </a>
    <span class="brand-badge">BizForce AI</span>
  </nav>

  <div id="exportRoot">
    <div class="state">Loading posts...</div>
  </div>
</div>

<script>
var API_URL = "https://dynamic-prosperity-production-5382.up.railway.app";
var CANONICAL_ORIGIN = "https://bizforceai.net";

// This page is served at /exports.html, so there is no clean-URL form to fall
// back from — the handle only ever arrives as ?u=.
var params = new URLSearchParams(window.location.search);
var handle = params.get("u") || "";

function formatDate(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  } catch (e) {
    return "";
  }
}

function asText(value) {
  return String(value == null ? "" : value);
}

// textContent throughout — nothing from the API is ever inserted as HTML on
// this page. The post body is parsed into a detached document instead, and
// that document is never attached to this one.
function showState(message, isError) {
  var box = document.createElement("div");
  box.className = "state" + (isError ? " error" : "");
  box.textContent = asText(message);

  var root = document.getElementById("exportRoot");
  root.textContent = "";
  root.appendChild(box);
}

if (handle) {
  document.getElementById("backLink").setAttribute("href", "/seller.html?u=" + encodeURIComponent(handle));
}

/* ---------------------------------------------------------------- transform */

// THE POINT OF THIS PAGE. Stored bodies carry root-relative hrefs like
// /blog/earth-rose/some-post and /listing/some-slug, which resolve only on
// bizforceai.net. Anywhere else they 404, so every export rewrites them.
//
// getAttribute, never el.href: the property resolves against THIS document's
// base URL, which would silently stamp the exports page's own origin onto
// every link. The raw attribute is the only honest source.
//
// A leading "//" is protocol-relative and already names its own host, so only
// a single leading slash counts as a path to absolutize.
function absolutizeLinks(doc) {
  var nodes = doc.querySelectorAll("[href]");
  for (var i = 0; i < nodes.length; i++) {
    var href = nodes[i].getAttribute("href");
    if (!href) continue;
    if (href.charAt(0) === "/" && href.charAt(1) !== "/") {
      nodes[i].setAttribute("href", CANONICAL_ORIGIN + href);
    }
  }
}

// DOMParser gives an inert document: scripts do not run and nothing loads.
// Regexes are not used to rewrite this HTML, and the result is never appended
// to the live page.
function parseBody(html) {
  var doc = new DOMParser().parseFromString(asText(html), "text/html");
  absolutizeLinks(doc);
  return doc;
}

function collapse(text) {
  return asText(text).replace(/\s+/g, " ").trim();
}

// The header block both exports share, so the fields can be pasted straight
// into a WordPress SEO plugin.
function headerBlock(post) {
  return [
    "Title: " + asText(post.title),
    "Meta Description: " + asText(post.meta_description),
    "Slug: " + asText(post.slug),
    "Keyword: " + asText(post.keyword)
  ].join("\n");
}

/* ----------------------------------------------------------------- markdown */

// Inline conversion. Any tag outside the known set falls through to its text
// content, so an unexpected tag loses its markup rather than leaking raw HTML
// into a Markdown file.
function inlineToMarkdown(node) {
  if (node.nodeType === 3) return node.nodeValue;
  if (node.nodeType !== 1) return "";

  var inner = "";
  for (var i = 0; i < node.childNodes.length; i++) {
    inner += inlineToMarkdown(node.childNodes[i]);
  }

  var tag = node.tagName.toLowerCase();
  if (tag === "strong") return "**" + inner + "**";
  if (tag === "em") return "*" + inner + "*";
  if (tag === "a") {
    var href = node.getAttribute("href");
    return href ? "[" + inner + "](" + href + ")" : inner;
  }
  return inner;
}

function listToMarkdown(listEl, ordered) {
  var lines = [];
  var items = listEl.children;
  for (var i = 0; i < items.length; i++) {
    if (items[i].tagName.toLowerCase() !== "li") continue;
    var text = collapse(inlineToMarkdown(items[i]));
    if (!text) continue;
    lines.push((ordered ? lines.length + 1 + ". " : "- ") + text);
  }
  return lines.join("\n");
}

function blockToMarkdown(node) {
  if (node.nodeType === 3) return collapse(node.nodeValue);
  if (node.nodeType !== 1) return "";

  var tag = node.tagName.toLowerCase();
  if (tag === "h2") return "## " + collapse(inlineToMarkdown(node));
  if (tag === "h3") return "### " + collapse(inlineToMarkdown(node));
  if (tag === "p") return collapse(inlineToMarkdown(node));
  if (tag === "ul") return listToMarkdown(node, false);
  if (tag === "ol") return listToMarkdown(node, true);
  // Unknown block: keep the text, drop the tag.
  return collapse(inlineToMarkdown(node));
}

function bodyToMarkdown(doc) {
  var blocks = [];
  var nodes = doc.body.childNodes;
  for (var i = 0; i < nodes.length; i++) {
    var block = blockToMarkdown(nodes[i]);
    if (block) blocks.push(block);
  }
  return blocks.join("\n\n");
}

/* ------------------------------------------------------------------ exports */

function buildHtmlExport(post) {
  var doc = parseBody(post.body);
  return headerBlock(post) + "\n\n" + doc.body.innerHTML;
}

function buildMarkdownExport(post) {
  var doc = parseBody(post.body);
  return headerBlock(post) + "\n\n" + bodyToMarkdown(doc);
}

/* -------------------------------------------------------------------- fetch */

async function fetchPost(slug) {
  // Same public route blogindex.html uses: no Authorization header, no token.
  var res = await fetch(
    API_URL + "/api/blog/" + encodeURIComponent(handle) + "/" + encodeURIComponent(slug)
  );

  if (res.status === 404) throw new Error("That post could not be found.");
  if (!res.ok) {
    var err = await res.json().catch(function () { return {}; });
    throw new Error(err.error || "Could not load this post");
  }

  var d = await res.json();
  return d.post || {};
}

/* ------------------------------------------------------------------ actions */

async function copyText(text) {
  // Rejects on an insecure origin, a denied permission, or an unfocused
  // document, and is simply absent in some browsers. Both paths report.
  if (!navigator.clipboard || !navigator.clipboard.writeText) {
    throw new Error("Clipboard is not available in this browser.");
  }
  await navigator.clipboard.writeText(text);
}

function downloadMarkdown(text, slug) {
  var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", (asText(slug) || "post") + ".md");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* ------------------------------------------------------------------ rendering */

function buildRow(post) {
  var card = document.createElement("div");
  card.className = "post-card";

  var title = document.createElement("h2");
  title.className = "card-title";
  title.textContent = asText(post.title);
  card.appendChild(title);

  var when = formatDate(post.published_at);
  if (when) {
    var dateEl = document.createElement("p");
    dateEl.className = "card-date";
    dateEl.textContent = when;
    card.appendChild(dateEl);
  }

  var actions = document.createElement("div");
  actions.className = "card-actions";

  var status = document.createElement("p");
  status.className = "card-status";

  function setStatus(message, kind) {
    status.className = "card-status" + (kind ? " " + kind : "");
    status.textContent = message;
  }

  // Bodies are fetched one at a time, on click — never prefetched for the
  // whole list.
  function runAction(button, label, handler) {
    button.addEventListener("click", async function () {
      var buttons = actions.querySelectorAll("button");
      for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
      setStatus("Preparing " + label + "...", null);

      try {
        var full = await fetchPost(post.slug);
        await handler(full);
      } catch (e) {
        setStatus(e.message || "Something went wrong.", "err");
      } finally {
        var again = actions.querySelectorAll("button");
        for (var j = 0; j < again.length; j++) again[j].disabled = false;
      }
    });
  }

  var copyHtmlBtn = document.createElement("button");
  copyHtmlBtn.type = "button";
  copyHtmlBtn.className = "action-btn";
  copyHtmlBtn.textContent = "Copy as HTML";
  runAction(copyHtmlBtn, "HTML", async function (full) {
    await copyText(buildHtmlExport(full));
    setStatus("HTML copied to clipboard.", "ok");
  });
  actions.appendChild(copyHtmlBtn);

  var copyMdBtn = document.createElement("button");
  copyMdBtn.type = "button";
  copyMdBtn.className = "action-btn";
  copyMdBtn.textContent = "Copy as Markdown";
  runAction(copyMdBtn, "Markdown", async function (full) {
    await copyText(buildMarkdownExport(full));
    setStatus("Markdown copied to clipboard.", "ok");
  });
  actions.appendChild(copyMdBtn);

  var downloadBtn = document.createElement("button");
  downloadBtn.type = "button";
  downloadBtn.className = "action-btn";
  downloadBtn.textContent = "Download as Markdown file";
  runAction(downloadBtn, "the download", async function (full) {
    downloadMarkdown(buildMarkdownExport(full), full.slug || post.slug);
    setStatus("Downloaded " + (asText(full.slug || post.slug) || "post") + ".md", "ok");
  });
  actions.appendChild(downloadBtn);

  card.appendChild(actions);
  card.appendChild(status);
  return card;
}

function render(blogName, posts) {
  var head = document.createElement("div");

  var h1 = document.createElement("h1");
  h1.className = "post-title";
  h1.textContent = blogName + " — Export Posts";
  head.appendChild(h1);

  var sub = document.createElement("p");
  sub.className = "post-meta";
  sub.textContent =
    (posts.length === 1 ? "1 published post" : posts.length + " published posts") +
    ". Links are rewritten to " + CANONICAL_ORIGIN + " so they still work off-platform.";
  head.appendChild(sub);

  var list = document.createElement("div");
  list.className = "post-list";
  posts.forEach(function (post) {
    if (!post || !post.slug) return;
    list.appendChild(buildRow(post));
  });

  var root = document.getElementById("exportRoot");
  root.textContent = "";
  root.appendChild(head);
  root.appendChild(list);
}

async function loadPosts() {
  if (!handle) {
    showState("Add ?u=your-handle to this address to list your posts for export.", false);
    return;
  }

  try {
    // Public route: no Authorization header, no token, no auth gate.
    var res = await fetch(API_URL + "/api/blog/" + encodeURIComponent(handle));

    if (res.status === 404) {
      showState("There are no posts yet.", false);
      return;
    }

    if (!res.ok) {
      var err = await res.json().catch(function () { return {}; });
      throw new Error(err.error || "Could not load these posts");
    }

    var d = await res.json();
    var posts = Array.isArray(d.posts) ? d.posts : [];
    var blogName = asText(d.display_name || d.handle || handle);

    document.title = blogName + " — Export Posts";

    if (!posts.length) {
      showState("There are no posts yet.", false);
      return;
    }

    render(blogName, posts);
  } catch (e) {
    showState(e.message || "Could not load these posts", true);
  }
}

loadPosts();
</script>
</body>
</html>
